<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3A8DFF">
<meta name="description" content="Sky Skip is a one-thumb endless jumper. Tap to hop over the bumps.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sky Skip">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sky Skip</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css?v=2">
</head>
<body>
<div id="ver">v1.1</div>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 390, H = 740, S = 1, dpr = 1;
  var ground = 560, playerX = 90, playerR = 26;
  var state = 'menu';
  var y = 0, vy = 0, onGround = true, jumping = false;
  var coyote = 0, buffer = 0;
  var speed = 280, dist = 0, score = 0, best = 0, newBest = false;
  var obstacles = [], clouds = [], hills = [];
  var t = 0, shake = 0, runPhase = 0, blink = 0;
  var soundOn = true, audioCtx = null;
  var last = 0;

  try { best = +localStorage.getItem('sky-skip-best') || 0; } catch (e) {}
  try { if (localStorage.getItem('sky-skip-sound') === '0') soundOn = false; } catch (e) {}

  function layout() {
    S = Math.max(0.8, Math.min(W, H) / 430);
    ground = H * 0.76;
    playerR = 26 * S;
    playerX = Math.max(78 * S, W * 0.26);
    if (!clouds.length) {
      var i;
      for (i = 0; i < 7; i++) clouds.push({x: Math.random() * W, y: 40 + Math.random() * H * 0.32, s: 0.6 + Math.random() * 1.1, p: 0.15 + Math.random() * 0.35});
      for (i = 0; i < 5; i++) hills.push({x: i * 220, c: i % 2 ? '#8EE6A2' : '#6AD58A'});
    }
  }
  function fit() {
    dpr = Math.min(2.5, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
    if (onGround) y = ground - playerR;
  }
  window.addEventListener('resize', fit);
  fit();
  y = ground - playerR;

  function saveBest() {
    try { localStorage.setItem('sky-skip-best', String(best)); } catch (e) {}
  }
  function saveSound() {
    try { localStorage.setItem('sky-skip-sound', soundOn ? '1' : '0'); } catch (e) {}
  }
  function beep(freq, dur, type, vol) {
    if (!soundOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, audioCtx.currentTime);
      g.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }

  function begin() {
    state = 'play';
    obstacles = [];
    dist = 0;
    score = 0;
    newBest = false;
    vy = 0;
    onGround = true;
    jumping = false;
    y = ground - playerR;
    shake = 0;
    speed = 280 * S;
  }
  function jump() {
    if (onGround || coyote > 0) {
      vy = -820 * S;
      onGround = false;
      coyote = 0;
      jumping = true;
      buffer = 0;
      beep(620, 0.09, 'sine', 0.05);
    } else {
      buffer = 0.12;
    }
  }
  function release() {
    jumping = false;
    if (vy < -280 * S) vy = -280 * S;
  }
  function die() {
    state = 'over';
    shake = 0.28;
    jumping = false;
    if (score > best) { best = score; newBest = true; saveBest(); }
    beep(220, 0.18, 'triangle', 0.07);
    setTimeout(function () { beep(140, 0.22, 'sine', 0.05); }, 90);
  }
  function soundBox() {
    var s = 48 * Math.min(S, 1.15);
    return {x: W - s - 14, y: 14, w: s, h: s};
  }
  function hitSound(px, py) {
    var b = soundBox();
    return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
  }
  function toggleSound() {
    soundOn = !soundOn;
    saveSound();
    if (soundOn) beep(660, 0.08, 'sine', 0.05);
  }
  function pointer(e) {
    var r = canvas.getBoundingClientRect();
    return {x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height)};
  }
  function onDown(e) {
    if (e.cancelable) e.preventDefault();
    var p = pointer(e);
    unlockAudio();
    if (hitSound(p.x, p.y)) { toggleSound(); return; }
    if (state !== 'play') begin();
    jump();
  }
  function onUp(e) {
    if (e.cancelable) e.preventDefault();
    release();
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  window.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    if (e.code === 'KeyM') { toggleSound(); return; }
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      unlockAudio();
      if (state !== 'play') begin();
      jump();
    }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') release();
  });

  function spawn(at) {
    var kind = Math.random();
    var h, w, type;
    if (kind < 0.4) { type = 'bush'; w = (46 + Math.random() * 24) * S; h = (54 + Math.random() * 28) * S; }
    else if (kind < 0.75) { type = 'rock'; w = (40 + Math.random() * 22) * S; h = (48 + Math.random() * 26) * S; }
    else { type = 'post'; w = 28 * S; h = (92 + Math.random() * 18) * S; }
    obstacles.push({x: at, w: w, h: h, type: type, scored: false});
  }
  function hits(o) {
    var cx = playerX, cy = y, rad = playerR * 0.78;
    var left = o.x + 4, right = o.x + o.w - 4, top = ground - o.h + 4, bottom = ground - 2;
    var nx = Math.max(left, Math.min(cx, right));
    var ny = Math.max(top, Math.min(cy, bottom));
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < rad * rad;
  }

  function update(dt) {
    t += dt;
    blink -= dt;
    if (blink < -0.12) blink = 2.4 + Math.random() * 2;
    if (shake > 0) shake -= dt;
    var i;
    for (i = 0; i < clouds.length; i++) {
      clouds[i].x -= speed * clouds[i].p * 0.35 * dt;
      if (clouds[i].x < -80 * S) clouds[i].x = W + 40;
    }
    if (state !== 'play') {
      y = ground - playerR + Math.sin(t * 3) * 6 * S;
      return;
    }
    speed = Math.min(860 * S, (270 + score * 2.4) * S);
    dist += speed * dt;
    var next = Math.floor(dist / (46 * S));
    if (next !== score) {
      score = next;
      if (score > 0 && score % 25 === 0) beep(740, 0.07, 'triangle', 0.04);
    }
    var gap = Math.max(210 * S, (500 - score * 1.1) * S);
    var lastX = obstacles.length ? obstacles[obstacles.length - 1].x : -9999;
    if (!obstacles.length && dist > 180 * S) spawn(W + 30);
    else if (obstacles.length && lastX < W - gap) spawn(W + 20 + Math.random() * 40 * S);

    var grav = (jumping && vy < 0) ? 1500 * S : 2700 * S;
    vy += grav * dt;
    y += vy * dt;
    if (y >= ground - playerR) {
      if (!onGround) beep(160, 0.05, 'sine', 0.03);
      y = ground - playerR;
      vy = 0;
      onGround = true;
      coyote = 0.1;
      if (buffer > 0) jump();
    } else {
      onGround = false;
      if (coyote > 0) coyote -= dt;
    }
    if (buffer > 0) buffer -= dt;
    if (onGround) runPhase += speed * dt * 0.02;

    for (i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].x -= speed * dt;
      if (hits(obstacles[i])) { die(); return; }
      if (obstacles[i].x + obstacles[i].w < -20) obstacles.splice(i, 1);
    }
  }

  function roundRect(x, y0, w, h, r) {
    var rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y0);
    ctx.arcTo(x + w, y0, x + w, y0 + h, rr);
    ctx.arcTo(x + w, y0 + h, x, y0 + h, rr);
    ctx.arcTo(x, y0 + h, x, y0, rr);
    ctx.arcTo(x, y0, x + w, y0, rr);
    ctx.closePath();
  }
  function cloud(c) {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    var s = 28 * S * c.s;
    ctx.beginPath();
    ctx.arc(c.x, c.y, s, 0, 6.3);
    ctx.arc(c.x + s * 0.9, c.y + s * 0.15, s * 0.75, 0, 6.3);
    ctx.arc(c.x - s * 0.85, c.y + s * 0.2, s * 0.65, 0, 6.3);
    ctx.fill();
  }
  function drawPlayer() {
    var bob = onGround && state === 'play' ? Math.abs(Math.sin(runPhase)) * 3 * S : 0;
    var px = playerX, py = y - bob;
    ctx.fillStyle = 'rgba(40,80,120,.18)';
    ctx.beginPath();
    ctx.ellipse(px, ground - 4, playerR * 0.85, playerR * 0.28, 0, 0, 6.3);
    ctx.fill();
    var squash = 1;
    if (vy < -40) squash = 0.9;
    if (onGround && state === 'play') squash = 1 + Math.abs(Math.sin(runPhase)) * 0.06;
    ctx.save();
    ctx.translate(px, py);
    ctx.scale(1 / squash, squash);
    ctx.fillStyle = '#FF8C40';
    ctx.beginPath();
    ctx.arc(0, 0, playerR, 0, 6.3);
    ctx.fill();
    ctx.fillStyle = '#FFE0A8';
    ctx.beginPath();
    ctx.arc(0, playerR * 0.22, playerR * 0.55, 0, 6.3);
    ctx.fill();
    var eye = blink > 0 && blink < 0.12 ? 0.15 : 1;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-playerR * 0.28, -playerR * 0.08, playerR * 0.16, playerR * 0.18 * eye, 0, 0, 6.3);
    ctx.ellipse(playerR * 0.28, -playerR * 0.08, playerR * 0.16, playerR * 0.18 * eye, 0, 0, 6.3);
    ctx.fill();
    ctx.fillStyle = '#2A3554';
    ctx.beginPath();
    ctx.arc(-playerR * 0.24, -playerR * 0.05, playerR * 0.07, 0, 6.3);
    ctx.arc(playerR * 0.32, -playerR * 0.05, playerR * 0.07, 0, 6.3);
    ctx.fill();
    ctx.strokeStyle = '#C85A32';
    ctx.lineWidth = Math.max(2, playerR * 0.08);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, playerR * 0.12, playerR * 0.28, 0.3, Math.PI - 0.3);
    ctx.stroke();
    ctx.fillStyle = '#FFB4A8';
    ctx.beginPath();
    ctx.arc(-playerR * 0.42, playerR * 0.1, playerR * 0.1, 0, 6.3);
    ctx.arc(playerR * 0.42, playerR * 0.1, playerR * 0.1, 0, 6.3);
    ctx.fill();
    ctx.restore();
    if (state === 'play' && onGround) {
      ctx.fillStyle = '#E07030';
      var f = Math.sin(runPhase);
      ctx.beginPath();
      ctx.ellipse(px - 8 * S, ground - 3, 7 * S, 4 * S, f * 0.4, 0, 6.3);
      ctx.ellipse(px + 8 * S, ground - 3, 7 * S, 4 * S, -f * 0.4, 0, 6.3);
      ctx.fill();
    }
  }
  function drawObstacle(o) {
    var x = o.x, top = ground - o.h;
    if (o.type === 'bush') {
      ctx.fillStyle = '#2FA86A';
      ctx.beginPath();
      ctx.arc(x + o.w * 0.5, ground - o.h * 0.45, o.w * 0.38, 0, 6.3);
      ctx.arc(x + o.w * 0.28, ground - o.h * 0.28, o.w * 0.3, 0, 6.3);
      ctx.arc(x + o.w * 0.72, ground - o.h * 0.3, o.w * 0.28, 0, 6.3);
      ctx.fill();
      ctx.fillStyle = '#47C57E';
      ctx.beginPath();
      ctx.arc(x + o.w * 0.48, ground - o.h * 0.55, o.w * 0.16, 0, 6.3);
      ctx.fill();
    } else if (o.type === 'rock') {
      ctx.fillStyle = '#FF6B81';
      roundRect(x, top, o.w, o.h, 12 * S);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      roundRect(x + 6, top + 6, o.w * 0.35, o.h * 0.22, 6);
      ctx.fill();
    } else {
      ctx.fillStyle = '#6C63FF';
      roundRect(x + o.w * 0.3, top + o.w * 0.7, o.w * 0.4, o.h - o.w * 0.5, 6);
      ctx.fill();
      ctx.fillStyle = '#FFE566';
      ctx.beginPath();
      ctx.arc(x + o.w * 0.5, top + o.w * 0.45, o.w * 0.55, 0, 6.3);
      ctx.fill();
    }
  }
  function drawWorld() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#5EB6FF');
    g.addColorStop(0.55, '#9AD8FF');
    g.addColorStop(1, '#C8F4D4');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,230,120,.9)';
    ctx.beginPath();
    ctx.arc(W * 0.82, H * 0.16, 42 * S, 0, 6.3);
    ctx.fill();
    var i;
    for (i = 0; i < clouds.length; i++) cloud(clouds[i]);
    ctx.fillStyle = '#8EE6A2';
    ctx.beginPath();
    ctx.moveTo(0, ground - 30 * S);
    for (i = 0; i <= W; i += 16) {
      var scroll = state === 'play' ? dist * 0.25 : t * 20;
      ctx.lineTo(i, ground - 36 * S - Math.sin((i + scroll) * 0.02) * 16 * S);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.fill();
    ctx.fillStyle = '#3CB371';
    ctx.fillRect(0, ground, W, H - ground);
    ctx.fillStyle = '#2E9B5A';
    ctx.fillRect(0, ground, W, 8 * S);
    var dash = 28 * S;
    var off = (state === 'play' ? dist : t * 80) % (dash * 2);
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for (i = -2; i < W / dash; i++) ctx.fillRect(i * dash * 2 - off, ground + 18 * S, dash, 4 * S);
  }
  function panel(title, lines, accent) {
    var pw = Math.min(W - 36, 340 * S);
    var ph = 210 * S;
    var x = (W - pw) / 2, y0 = H * 0.18;
    ctx.fillStyle = 'rgba(255,255,255,.94)';
    roundRect(x, y0, pw, ph, 22);
    ctx.fill();
    ctx.fillStyle = '#243056';
    ctx.textAlign = 'center';
    ctx.font = '800 ' + Math.round(36 * S) + 'px system-ui, sans-serif';
    ctx.fillText(title, W / 2, y0 + 52 * S);
    ctx.fillStyle = accent || '#3A7BD5';
    ctx.font = '650 ' + Math.round(18 * S) + 'px system-ui, sans-serif';
    var i;
    for (i = 0; i < lines.length; i++) ctx.fillText(lines[i], W / 2, y0 + (96 + i * 28) * S);
  }
  function drawSound() {
    var b = soundBox();
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    roundRect(b.x, b.y, b.w, b.h, 14);
    ctx.fill();
    ctx.strokeStyle = '#243056';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    var cx = b.x + b.w * 0.38, cy = b.y + b.h * 0.5;
    ctx.moveTo(cx - 6, cy - 4);
    ctx.lineTo(cx - 6, cy + 4);
    ctx.lineTo(cx + 2, cy + 4);
    ctx.lineTo(cx + 8, cy + 9);
    ctx.lineTo(cx + 8, cy - 9);
    ctx.lineTo(cx + 2, cy - 4);
    ctx.closePath();
    ctx.stroke();
    if (soundOn) {
      ctx.beginPath();
      ctx.arc(cx + 10, cy, 6, -0.8, 0.8);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx + 10, cy, 11, -0.7, 0.7);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(b.x + 12, b.y + 12);
      ctx.lineTo(b.x + b.w - 12, b.y + b.h - 12);
      ctx.stroke();
    }
  }
  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 6);
    drawWorld();
    var i;
    for (i = 0; i < obstacles.length; i++) drawObstacle(obstacles[i]);
    drawPlayer();
    ctx.restore();
    drawSound();
    ctx.textAlign = 'center';
    if (state === 'play') {
      ctx.fillStyle = '#fff';
      ctx.font = '800 ' + Math.round(40 * S) + 'px system-ui, sans-serif';
      ctx.fillText(String(score), W / 2, 58 * S);
      ctx.font = '600 ' + Math.round(14 * S) + 'px system-ui, sans-serif';
      ctx.fillText('Best ' + best, W / 2, 80 * S);
    } else if (state === 'menu') {
      panel('Sky Skip', ['Tap to jump', 'Hop over the bumps', 'Best ' + best]);
      ctx.fillStyle = '#243056';
      ctx.font = '700 ' + Math.round(16 * S) + 'px system-ui, sans-serif';
      ctx.fillText('Tap anywhere to start', W / 2, H * 0.18 + 188 * S);
      ctx.fillStyle = '#243056';
      ctx.font = '800 ' + Math.round(13 * S) + 'px system-ui, sans-serif';
      ctx.fillText('v1.1', W / 2, H * 0.18 + 214 * S);
    } else {
      panel(newBest ? 'New best!' : 'Game over', ['Score ' + score, 'Best ' + best, 'Tap to play again'], newBest ? '#E09A12' : '#3A7BD5');
    }
  }

  function frame(now) {
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (!document.hidden) update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if ('serviceWorker' in navigator) {
    var once = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (once) return;
      once = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' }).then(function (reg) {
      if (reg && reg.update) reg.update();
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
