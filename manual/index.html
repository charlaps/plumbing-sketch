<style>
:root{--bg:#f1f5f9;--surface:#fff;--surface2:#eaf0f6;--line:#d3dde8;--text:#10243a;--muted:#4f647b;--brand:#0b2a4a;--brand2:#134a78;--accent:#0b8196;--accent-soft:#dff3f7;--on-accent:#fff;--warn:#b42318;--warn-soft:#fdecea;--ok:#177a43;--ok-soft:#e3f5ea;--amber:#8a5a00;--amber-soft:#fff4d6;--shadow:0 2px 8px rgba(10,30,60,.12);--r:16px}
html[data-theme=dark]{--bg:#0b131c;--surface:#15202c;--surface2:#1d2b3a;--line:#2b3c4f;--text:#e9eff6;--muted:#a1b3c7;--brand:#08182a;--brand2:#0f3a60;--accent:#3cc6d9;--accent-soft:#12394a;--on-accent:#04222a;--warn:#ff8d82;--warn-soft:#3a1a1a;--ok:#5fd68f;--ok-soft:#133323;--amber:#f3c969;--amber-soft:#3a2e10;--shadow:0 2px 8px rgba(0,0,0,.5)}
@media (prefers-color-scheme:dark){html[data-theme=auto]{--bg:#0b131c;--surface:#15202c;--surface2:#1d2b3a;--line:#2b3c4f;--text:#e9eff6;--muted:#a1b3c7;--brand:#08182a;--brand2:#0f3a60;--accent:#3cc6d9;--accent-soft:#12394a;--on-accent:#04222a;--warn:#ff8d82;--warn-soft:#3a1a1a;--ok:#5fd68f;--ok-soft:#133323;--amber:#f3c969;--amber-soft:#3a2e10;--shadow:0 2px 8px rgba(0,0,0,.5)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;font-size:100%}
html[data-size=l]{font-size:112.5%}
html[data-size=xl]{font-size:125%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:1.125rem;line-height:1.5;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
a{color:var(--accent)}
svg.ic{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#bar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;min-height:58px}
#bar h1{flex:1;min-width:0;margin:0;font-size:1.1rem;line-height:1.2;font-weight:700;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ib{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ib:active{background:rgba(255,255,255,.18)}
.ib[hidden]{display:none}
#bar .on svg{fill:#ffd34d;stroke:#ffd34d}
#view{max-width:760px;margin:0 auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;font-size:.72rem;font-weight:600;color:var(--muted);text-decoration:none}
#nav a.cur{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.hero{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.hero .logo{width:56px;height:56px;border-radius:14px;flex:none}
.hero h2{margin:0;font-size:1.35rem;line-height:1.15}
.hero p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.searchbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;border-radius:16px;background:var(--surface);border:2px solid var(--line);padding:0 16px;color:var(--muted);text-align:left;font-size:1.05rem;margin-bottom:12px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.qbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:1rem;text-decoration:none;padding:6px 10px;text-align:center;line-height:1.2}
.qbtn.alt{background:var(--brand2);color:#fff}
html[data-theme=dark] .qbtn.alt{background:var(--surface2);color:var(--text)}
@media (prefers-color-scheme:dark){html[data-theme=auto] .qbtn.alt{background:var(--surface2);color:var(--text)}}
.sechd{margin:16px 2px 8px;font-size:.85rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;min-height:132px;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:var(--text);position:relative}
.tile:active,.row:active{transform:scale(.98)}
.tile .ti{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.tile .tn{position:absolute;top:10px;right:12px;font-weight:800;color:var(--muted);font-size:.9rem}
.tile b{font-size:1.05rem;line-height:1.2}
.tile small{color:var(--muted);font-size:.8rem;line-height:1.25}
.tile.red .ti{background:var(--warn-soft);color:var(--warn)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;min-height:60px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--text);font-weight:600;line-height:1.25}
.row span.t{flex:1;min-width:0}
.row small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.row .chev{color:var(--muted)}
.row .pin{color:#e0a800}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:8px 16px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:1rem;color:var(--text);text-decoration:none;flex:1 1 140px;text-align:center;line-height:1.2}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn.dng{color:var(--warn)}
.btn:active{transform:scale(.97)}
.btn.sm{min-height:46px;font-size:.95rem;flex:0 1 auto}
h2.pt{font-size:1.4rem;line-height:1.2;margin:4px 0 4px}
.crumb{color:var(--muted);font-size:.85rem;margin-bottom:6px}
.blk{margin:0 0 14px}
h3.bh{font-size:1.15rem;margin:18px 0 6px;color:var(--accent)}
p.bp{margin:0 0 10px}
ul.bl,ol.bl{margin:0 0 10px;padding-left:1.4em}
ul.bl li,ol.bl li{margin:0 0 8px;padding-left:2px}
ol.bl li::marker{font-weight:800;color:var(--accent)}
.note,.warn,.sans,.verify{border-radius:14px;padding:12px 14px;margin:0 0 14px;border-left:6px solid var(--accent);background:var(--accent-soft)}
.warn{border-color:var(--warn);background:var(--warn-soft)}
.warn::before{content:"Warning";display:block;font-weight:800;color:var(--warn);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.sans{border-color:var(--ok);background:var(--ok-soft)}
.verify{border-color:#d9a000;background:var(--amber-soft)}
.badge{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:800;background:var(--surface);border:1px solid currentColor;color:var(--ok)}
.verify .badge{color:var(--amber)}
.tc{border:1px solid var(--line);background:var(--surface);border-radius:14px;margin:0 0 10px;overflow:hidden}
.tc .th{padding:10px 14px;background:var(--surface2);font-weight:800}
.tc .tr{padding:8px 14px;border-top:1px solid var(--line)}
.tc .tr small{display:block;color:var(--muted);font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
table.ct{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 14px}
table.ct th,table.ct td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.ct th{background:var(--surface2);font-size:.85rem}
table.ct td:last-child{text-align:right;white-space:nowrap}
.chk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:0 0 16px;box-shadow:var(--shadow);overflow:hidden}
.chk .ch{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--accent-soft)}
.chk .ch b{flex:1;min-width:0}
.chk .cnt{font-weight:800;color:var(--accent);flex:none}
.prog{height:6px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
label.ci{display:flex;align-items:flex-start;gap:14px;min-height:56px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
label.ci:first-of-type{border-top:0}
label.ci input{width:30px;height:30px;margin:0;flex:none;accent-color:var(--accent)}
label.ci span{flex:1;min-width:0;padding-top:2px}
label.ci input:checked+span{text-decoration:line-through;color:var(--muted)}
.chk .cf{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.chk .cf .btn{min-height:46px;font-size:.95rem}
.fl{display:block;margin:0 0 12px}
.fl>span{display:block;font-weight:700;font-size:.95rem;margin-bottom:4px}
.fl input,.fl textarea,.fl select,.ci2{width:100%;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:10px 12px;font-size:1rem}
.fl textarea{min-height:100px;resize:vertical}
.fl input:focus,.fl textarea:focus,.fl select:focus{border-color:var(--accent);outline:none}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 16px;box-shadow:var(--shadow)}
.fcard>h3{margin:0 0 10px;font-size:1.1rem}
.tpl textarea{min-height:170px}
.res{background:var(--brand);color:#fff;border-radius:var(--r);padding:14px;margin:6px 0 12px}
html[data-theme=dark] .res{background:var(--surface2)}
@media (prefers-color-scheme:dark){html[data-theme=auto] .res{background:var(--surface2)}}
.res .big{font-size:1.9rem;font-weight:800;line-height:1.1;color:#fff;word-break:break-word}
html[data-theme=dark] .res .big,html[data-theme=dark] .res{color:var(--text)}
.res small{opacity:.85}
.rrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.18)}
.rrow:last-child{border-bottom:0}
.rrow b{white-space:nowrap}
.rrow.tot{font-size:1.15rem;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{min-height:52px;padding:6px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;flex:1 1 90px;text-align:center;line-height:1.2}
.chip small{display:block;font-weight:400;font-size:.7rem;color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.sw{display:flex;align-items:center;gap:12px;min-height:52px;font-weight:600;margin:0 0 12px}
.sw input{width:28px;height:28px;accent-color:var(--accent);flex:none}
#q{width:100%;min-height:56px;border-radius:16px;border:2px solid var(--accent);background:var(--surface);padding:0 16px;font-size:1.1rem;margin-bottom:12px}
mark{background:#ffe27a;color:#222;border-radius:3px;padding:0 1px}
.snip{display:block;color:var(--muted);font-weight:400;font-size:.85rem;margin-top:2px}
.pn{display:flex;gap:8px;margin-top:18px}
.pn a{flex:1}
#toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:50;margin:0 auto;max-width:520px;background:#111c28;color:#fff;border-radius:14px;padding:12px 16px;text-align:center;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin:18px 0}
.seg{display:flex;gap:8px;margin:0 0 14px}
.seg button{flex:1;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.inst{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:16px;padding:10px 12px;margin-bottom:12px}
.inst span{flex:1;font-weight:600;line-height:1.25}

</style>
</head>

var SECTIONS=[];
SECTIONS.push({id:'about',title:'About APS & how we work',icon:'info',blurb:'Who we are, standards, punctuality, photos',pages:[
{id:'about-us',title:'Who we are',kw:'company aps charl victor krugersdorp pretoria edenvale crew team promise values',b:[
['p','APS is a plumbing company run by **Charl Knoetze**. We work in and around **Krugersdorp, Pretoria and Edenvale**.'],
['p','This manual is for Charl and the crew. It is a quick guide for on site: short, plain steps you can follow with dirty hands. It does **not** replace the SANS standards, the manufacturer’s instructions or your training.'],
['h','Our promise to every customer'],
['ul',['Do the job properly the first time.','Be on time. If we will be late, say so early.','Explain the problem and the price in plain words, before we start.','Keep the site clean and protect the customer’s property.','Work safely and to the South African standards.','Take photos: before, during and after.','Leave the customer knowing what was done and what to do if there is a problem.']],
['note','Put APS’s own details (VAT number, PIRB number, bank details, phone numbers) in **Contacts & company details**. They are saved on this phone only.'],
['goto','Open Contacts & company details','co-details']
]},
{id:'about-how',title:'How we work',kw:'standards customers punctuality late on time landlord tenant body corporate access keys professional behaviour',b:[
['h','Standards'],
['ul',['We follow the South African national standards for plumbing (SANS 10252-1 water supply, SANS 10252-2 drainage, SANS 10254 geysers, SANS 10400-P drainage in the building regulations). See the **SANS quick guide**.','We follow the pipe and fitting maker’s instructions.','Where a Certificate of Compliance is needed, it is done by a person who is registered to issue it. See PIRB basics in the SANS quick guide.']],
['sans','The SANS quick guide is a short summary only.'],
['h','Customers'],
['p','Our customers are homeowners, landlords and tenants, body corporates, estate agents, and small businesses. Always find out who the **decision maker** is (who approves the price and who pays) and who has the **keys and access**.'],
['h','Punctuality'],
['ol',['Confirm the address, time and job the day before.','Message the customer when you leave: “On my way, ETA ___”.','Aim to arrive on time. If you will be more than 15 minutes late, message the customer **before** the booked time.','If you cannot make it at all, phone – do not only send a message.','Be neat: clean APS clothing, clean boots, name on the shirt if possible.']],
['h','On site behaviour'],
['ul',['Greet and introduce yourself by name.','Ask before using the customer’s toilet, power or water.','No smoking, loud music or swearing on site.','Keep pets and children safely away from the work.','Never criticise another tradesperson in front of the customer. Tell Charl.','Do not promise what you cannot do. Phone Charl if unsure.']]
]},
{id:'about-photos',title:'Photos: what to take',kw:'photos pictures camera proof insurance evidence before after',b:[
['p','Photos protect us and the customer. They prove what was there before, what we did, and that the job was finished properly. They also help with quotes and insurance claims.'],
['chk','c.photos','Photo checklist',['Wide photo of the area before we start','Close photo of the problem (leak, damage, blocked fixture)','Geyser or fitting data plate (make, size, pressure rating, serial number)','Water meter reading (for leak jobs)','Pressure gauge reading before/after','Pipes in walls or floors BEFORE they are covered','Trench or drain with a tape measure showing depth/fall','Safety valve and its discharge pipe (geyser)','Finished work, from the same angle as the “before”','Area after clean-up','Signed certificate or job card']],
['h','Tips'],
['ul',['Hold the phone sideways (landscape). Wipe the lens.','Take one wide photo and one close photo.','Use a tape measure or your hand to show size.','Ask permission before photographing inside a home. Do not photograph people, documents or valuables.','Name the folder with the address and date, for example “12 Main St 2026-10-03”.','Send the photos to the end-of-day report.']]
]}
]});

['chk','c.arrive','Arrival checklist',['Customer greeted and problem understood','Main water valve located','DB board located (if geysers or pumps are involved)','Before photos taken','Floors and furniture protected','Price or basis agreed with the customer','Safety check of the work area done']]

{id:'daily-during',title:'During the job',kw:'during work extra work variation approval materials notes water off notice',b:[

]},
{id:'daily-handover',title:'Hand-over & clean-up',kw:'handover hand over cleanup clean up finish customer sign off warranty',b:[
['chk','c.handover','Hand-over checklist',['Every tap/fixture/valve worked and tested','No leaks after 10–15 minutes (check again before leaving)','Water and power back on and normal','Isolating valve location shown to the customer','Customer shown what was done and how to use it','Old parts removed (or customer asked if they want them)','Waste, offcuts and packaging removed','Floors, basin and surfaces wiped clean','After photos taken','Certificate or job card completed and signed (if required)','Invoice or payment arrangement explained','Aftercare and guarantee explained (see Customer communication)','Thanked the customer']],
['p','Leave it cleaner than you found it. A clean site is the best advert APS has.']
]},

SECTIONS.push({id:'safety',title:'Safety',blurb:'PPE, roofs, trenches, hot water, electricity, lifting, first aid',icon:'shield',pages:[
{id:'saf-prestart',title:'Pre-start safety check',kw:'safety check risk assessment start of job hazards',b:[
['p','Before you start, look around for hazards. Do this on every job – it takes two minutes.'],
['chk','c.prestart','Pre-start safety check',['PPE on for the task','Work area clear and tidy','Ladder safe, level and tied/held','Water isolated where needed; know where the main valve is','Electricity isolated and tested dead where needed','Hot water (geyser, pipes) allowed to cool or controlled','Asbestos suspected? Stop and phone Charl','Trench or excavation safe (see Trenches)','Customer, children and pets kept away','Fire extinguisher and first aid kit within reach','Second person available for lifting or roof work']]
]},
{id:'saf-ppe',title:'PPE (protective gear)',kw:'ppe boots gloves glasses mask hard hat ear plugs hi-vis knee pads protective',b:[
['table',['PPE','When'],[['Safety boots','Always on site'],['Work gloves','Handling pipe, cutting, drains. Use waterproof/chemical gloves for sewage and chemicals'],['Safety glasses','Cutting, chasing, drilling, soldering, drain cleaning, chemicals, working overhead'],['Dust mask (FFP2 or better)','Chasing or drilling brick/concrete, insulation, dusty roof spaces'],['Hard hat','Under or near overhead work, in trenches and on building sites'],['Ear plugs/muffs','Breaker, chasing machine, grinder, jetter'],['Hi-vis vest','Roadside, building sites, driveways'],['Knee pads','Floor work, bathrooms, kitchens']]],
['warn','PPE is the last line of defence. Remove or control the hazard first (isolate, cool, support, ventilate).']
]},
{id:'saf-roof',title:'Roof spaces & ladders',kw:'roof ceiling ladder fall height geyser attic trusses heat',b:[
['h','Ladders'],
['ul',['Check the ladder before use: feet, rungs, locks, no cracks.','Set it at about 1 m out for every 4 m of height (1:4), on firm level ground.','Tie it at the top or have someone foot it.','Three points of contact. Do not carry heavy items up while climbing – hoist them.','Never use a metal ladder near electrical wires or the DB.']],
['h','Working in a roof space (geysers)'],
['ol',['Isolate the geyser power at the DB first.','Tell someone in the house that you are in the roof.','Step **only on the trusses/rafters or a board laid across them**. Never on the ceiling board – it will not carry you and you can fall through.','Use a head torch. Watch for sharp nails, live cables and wasps.','Wear a dust mask and gloves. In summer the roof gets very hot: go early, drink water, take breaks.','Do not work in a roof space alone if you can avoid it.','Keep the geyser tray and pipes clear of insulation that blocks them.']],
['warn','Asbestos-cement roof sheets are fragile and may contain asbestos. Do not walk on or drill roof sheets. Use crawling boards.']
]},
{id:'saf-trench',title:'Trenches & excavations',kw:'trench excavation digging collapse shoring services cables sewer',b:[
['ul',['Find out what is buried **before you dig**: electrical cables, water, telecom lines, sewer. Ask the owner and look for plans. Dig carefully near services and hand-dig the last bit.','Keep spoil (dug soil) at least 0.5 m back from the edge, and keep tools off the edge.','Do not work in a deep trench with unsupported sides. As a rule of thumb, anything deeper than knee height and in loose soil needs the sides sloped back or shored. For deeper than about 1 m treat it as needing support and get advice.','Never work alone in a trench.','Keep a ladder or exit within easy reach. Barricade the trench so people and pets do not fall in.','After rain, re-check the sides. Do not enter a trench with water in it.','Never enter a manhole or sewer chamber. Gas can kill very quickly.']],
['warn','Trench collapse is one of the most deadly construction accidents. If in doubt, do not go in. Phone Charl.']
]},
{id:'saf-hot',title:'Hot water & scalding',kw:'scald hot water geyser burn temperature 60 legionella cool',b:[
['ul',['Geysers are normally set to about **60 °C**. Water at this temperature can scald in seconds.','Let the geyser and pipes cool, or draw the hot water off, before you work on them.','Drain into a bucket or a hose to a safe place, not onto your feet or the customer’s floor.','Open a hot tap before you undo a joint on a hot line to release pressure.','Warn children and the customer when you are working on hot water.','Never block or cap the safety valve discharge pipe.','When filling a new geyser, open a hot tap so air can escape, and do not switch the power on until the geyser is full.']],
['h','If someone is scalded'],
['ol',['Remove them from the hot water. Remove wet clothing near the burn, but do not pull off stuck clothing.','Cool the burn under **cool running water for 20 minutes**. Do not use ice, butter or toothpaste.','Cover loosely with a clean non-fluffy cover (cling film is good).','Phone for help for large burns, burns on the face/hands/genitals, or any burn on a child or baby.']]
]},
{id:'saf-elec',title:'Electrical isolation near geysers',kw:'electrical isolate electricity geyser dB isolator element thermostat shock lock out',b:[
['warn','Water and electricity can kill. Geyser wiring, elements and thermostats must be done by a **registered electrical person**. Plumbers isolate and make safe – they do not do the electrical work unless registered.'],
['ol',['Switch off the geyser at the **DB board** (the geyser breaker) **and** at the geyser isolator switch if there is one.','Put a label or tape on the breaker: “Do not switch on – plumber at work”.','If you can, lock the DB or keep the key with you.','Test that it is dead with a tester or ask the electrician.','Never touch cables or terminals because someone says “it’s off”. Check yourself.','Never switch the geyser back on until it is **full of water**. A dry element burns out.','Keep wet hands and wet tools away from the DB and cable joints.']],
['note','After a geyser replacement an Electrical Certificate of Compliance may be needed for the electrical part. That is issued by the electrician, not by the plumber.'],
['verify','Confirm the electrical certificate requirements for the municipality and the customer’s insurer.']
]},
{id:'saf-lift',title:'Lifting & manual handling',kw:'lifting heavy back geyser weight handling team',b:[
['ul',['Geysers are heavy: a full 150 ℓ geyser weighs more than 150 kg. Always drain before lifting, and use **two people** for 150 ℓ and bigger.','Plan the route: doors, stairs, ladders, hatch openings.','Bend your knees, keep your back straight, hold the load close.','Do not twist while carrying. Turn your feet.','Use a trolley, straps or a rope-and-pulley to the roof, not your shoulders on a ladder.','Share the weight of long pipe lengths: one person at each end.','Stop if it is too heavy. Ask for help.']]
]},
{id:'saf-asbestos',title:'Asbestos awareness',kw:'asbestos cement pipe roof sheets ac pipe dust fibre',b:[
['p','Many older South African buildings (before about the 1980s–90s) have **asbestos-cement** (AC) roof sheets, flue pipes, gutters, water pipes and ceiling boards. Breathing the fibres can cause serious lung disease years later.'],
['ul',['Look before you cut, drill or break anything on an old building. If it looks like grey fibre-cement and you are not sure, treat it as asbestos.','**Do not** drill, cut, sand, break or scrub it. Do not use power tools on it. Do not sweep it dry.','Stop work. Keep other people away. Phone Charl.','If it is in good condition and not disturbed, it is usually left alone. Damaged or disturbed asbestos must be handled by a registered asbestos contractor.','Wet the material lightly only if disturbed by accident, and keep away from the dust.','Wash your hands and change clothes. Do not shake dusty clothes.']],
['warn','Never cut AC water pipe with a saw or grinder. Phone Charl to arrange the right method.']
]},
{id:'saf-fire',title:'Hot work & fire',kw:'soldering brazing flame torch gas fire extinguisher roof timber',b:[
['ul',['Hot work = soldering, brazing, gas torch.','Check what is behind the wall or above you: timber, insulation, ceilings, thatch. Use a **heat shield/flame guard mat**.','Keep a fire extinguisher or a bucket of water next to you.','Never solder on a pipe that still has water in it. Drain and dry it first.','Gas bottles: upright, tied, away from heat, valve closed when not in use. Check hoses for leaks with soapy water.','After finishing, check the work area again for smouldering 30 minutes later.','Do not use a naked flame in a roof space with dry dust or thatch.']]
]},
{id:'saf-sewage',title:'Sewage & hygiene',kw:'sewage hygiene germs gloves wash tetanus chemicals drain gas',b:[
['ul',['Wear waterproof gloves and glasses when working on drains and sewers.','Do not eat, drink or smoke until you have washed your hands with soap.','Cover cuts with waterproof plasters. See a doctor if a cut is exposed to sewage.','Keep your tetanus injection up to date.','Ventilate enclosed spaces. Sewer gas (hydrogen sulphide) smells like rotten eggs but you can stop smelling it – do not trust your nose. Never enter manholes.','Do not mix chemicals. Read the label of drain cleaners. Wear glasses.','Clean and disinfect tools and the work area afterwards. Bag contaminated waste.']]
]},
{id:'saf-firstaid',title:'First aid & emergencies',kw:'first aid emergency ambulance 112 10177 injury cut electric shock burn',b:[
['h','Emergency numbers (South Africa)'],
['ul',['**112** – emergency from any cellphone','**10177** – ambulance (landline or cellphone)','**10111** – police']],
['note','Add your local doctor, hospital and the nearest clinic in **Contacts & company details > Emergency**.'],
['goto','Open emergency contacts','co-emergency'],
['h','Quick actions'],
['table',['Situation','Do this'],[['Electric shock','Switch off the power first. Do not touch the person until it is off. Call for help. Start CPR if not breathing.'],['Bleeding','Press firmly on the wound with a clean cloth. Raise the limb. Keep pressing. Call for help if serious.'],['Burn or scald','Cool under running water for 20 minutes. Cover loosely. Call for help for large burns.'],['Eye injury or chemical in eye','Rinse with clean water for at least 15 minutes. Get medical help.'],['Fall from height','Do not move the person unless in danger. Call for help.'],['Fainting or heat exhaustion','Move to shade, lay down, give sips of water, cool the person.'],['Gas smell','Do not switch anything on or off. Open windows, leave, call the gas supplier or emergency services.']]],
['verify','First aid course training is recommended for everyone on the crew.']
]}
]});

['chk','c.assess','Site assessment checklist',['Customer details and address','What exactly does the customer want? Write it down','Photos of the area, the problem and the existing pipes','Measure lengths, heights and distances (and note fall for drains)','Existing pipe type and size (copper, galvanised, uPVC …)','Water pressure (gauge on outside tap) – high or low?','Access: roof, crawl space, tiled walls, ceiling, trenches','What must be broken out and made good?','Who does the extras: tiler, electrician, painter?','Special parts needed (lead times)','Do we need a Certificate of Compliance?','Customer’s budget and timing']]

{id:'q-materials',title:'Materials list',kw:'materials list bill of quantities fittings pipe quote sketch',b:[
['ol',['Draw the job in the **Plumbing Sketch** app. It makes a materials list for you.','Add every pipe length, fitting, valve, tap and fixture.','Add the small items: clips, PTFE tape, solder, flux, glue, silicone, sealing washers, screws, wall plugs.','Add **10%** extra for waste on long pipe runs if you cut often (your choice).','Price each item from your supplier’s current price list.','Check the list against the sketch twice.']],

{id:'q-labour',title:'Labour, call-out & rates',kw:'labour call-out callout hourly rate day rate travel after hours',b:[

{id:'q-deposit',title:'Deposits & payment',kw:'deposit payment eft cash proof of payment banking credit terms',b:[
['ol',['Tell the customer **before** the work how and when to pay.','For larger jobs, ask for a **deposit** to cover materials. The amount is set by Charl (see rates).','Give the banking details clearly (from Contacts & company details). Use the customer’s name or invoice number as reference.','Take **proof of payment** before ordering large special-order parts.','On completion: hand over the invoice and ask for the balance.','No work is “done” until it is paid, or agreed in writing.','Follow up politely if unpaid: see Customer communication scripts.']],

{id:'q-invoice',title:'Invoice checklist',kw:'invoice tax invoice vat number number date description',b:[

SECTIONS.push({id:'proc',title:'Procedures & checklists',blurb:'Geyser, leaks, taps, WC, drains, rough-in, points, testing',icon:'clip',pages:[
{id:'pr-geyser',title:'Geyser replacement',kw:'geyser water heater replace install drip tray safety valve t&p vacuum breaker drain pressure control valve certificate',b:[
['warn','Isolate the electricity first. Wiring, element and thermostat work and the electrical certificate must be done by a registered electrical person.'],
['sans','Follow SANS 10254 and the geyser maker’s instructions. Details in the SANS quick guide.'],
['h','Steps'],
['ol',['**Check the old geyser:** size (litres), pressure rating (kPa), type. Photograph the data plate. Check the supply pressure with a gauge.','**Switch off** the geyser breaker at the DB and the isolator. Label it. Test it is dead.','**Close** the cold feed isolating valve. Open a hot tap in the house to relieve pressure.','**Drain** the geyser through the drain cock or a hose to a safe place. The water may be scalding: let it cool first.','**Disconnect** the pipes and the safety valve drain. The electrical person disconnects the wiring. Lift the geyser out with two people.','**Check the drip tray** and its drain pipe. The tray must be larger than the geyser, sit level and drain with a fall to a visible, safe outside point. Replace if rusty or cracked.','**Set the new geyser** on a solid base or secure brackets that can carry the full weight.','**Fit the valves** in the order the maker shows: isolating valve, non-return valve, pressure control valve if supply pressure is above the geyser’s rating, vacuum breaker(s) above the top of the geyser, and the **temperature & pressure (T&P) safety valve** on the geyser’s safety port.','**Connect the safety valve drain pipe:** metal, at least the valve’s size, continuous fall, maximum 3 bends, discharging to a visible place outside.','**Connect** cold in and hot out to the correct ports with new connectors. Insulate the hot pipe and the geyser as required.','**Fill slowly** with a hot tap open until water runs without air. Close the tap. Check every joint for leaks.','**Only when the geyser is full:** have the electrical person reconnect and switch on. Set the thermostat (usually about 60 °C).','**Check** the safety valve drain: no drips on the pipe, discharge visible. Test the valve lever briefly (water must flow and stop).','Take photos. Complete the Certificate of Compliance if required (see PIRB basics).','Hand over: show the customer the isolating valve and the DB switch.']],
['verify','Insurance companies usually ask for a plumber’s Certificate of Compliance when a geyser is replaced. Check the requirement for each job.'],
['chk','c.geyser','Geyser replacement checklist',['Old geyser data plate photographed','Power isolated, labelled and tested dead','Water isolated and drained safely','Drip tray sound with a drain to a visible outside point','Geyser secured; supports can carry the full weight','Isolating valve and non-return valve fitted','Pressure control valve fitted if supply pressure is above rating','Vacuum breaker(s) fitted above the top of the geyser','T&P safety valve fitted','Safety valve drain: metal, ≥ valve size, continuous fall, ≤ 3 bends, visible outside','Hot pipe and geyser insulated as required','Filled with all air out; no leaks','Electrical reconnected by the registered person AFTER the geyser was full','Thermostat set; hot water at tap checked','After photos taken','Certificate of Compliance done (if required)','Customer shown valves and DB switch']]
]},
{id:'pr-leak',title:'Leak detection & repair',kw:'leak detect water meter pressure drop hidden leak damp burst pipe repair acoustic',b:[
['h','Find the leak'],
['ol',['**Ask:** where and when did you first notice? Any change in the water bill? Hear running water?','**Meter test:** close every tap and appliance. Check the water meter. If the dial or the small “low-flow” indicator is moving, water is going somewhere.','**Isolate sections:** close the isolating valves one by one (geyser, garden, house) and watch the meter again. The meter stops when you close the section with the leak.','**Check the usual suspects:** running toilets (put food colouring in the cistern: colour in the bowl without flushing means a leaking flush valve), dripping taps, geyser safety valve drain, outside taps and irrigation.','**Pressure test** the isolated section with a gauge and look for a drop.','**Pinpoint:** look for damp, stains, warm patches on a floor (hot pipe), listen with a listening device, use a moisture meter or a thermal camera.','**Open up** as little as possible. Take photos.']],
['h','Repair'],
['ol',['Cut out the damaged section. Use the correct fitting for the pipe type. No tape-and-hope.','Check the nearby pipe for corrosion – replace if it is poor.','Support the pipe properly.','Refill, bleed air, and **test** under pressure for at least 15 minutes.','Re-check the meter with all taps closed.','Make good or tell the customer who must do it (tiler, plasterer).','Photos before closing up.']],
['chk','c.leak','Leak repair checklist',['Meter test done and result noted','Leak located and photographed','Isolating valves closed, power isolated if near electrics','Correct repair fitting used','Pipe supported','Pressure tested after repair','Meter checked again, no movement','Wall/floor opening explained and made safe','Customer told about damp drying time and who does making good']]
]},
{id:'pr-tap',title:'Tap & mixer replacement',kw:'tap mixer replace basin sink bath shower flexi hose angle valve cartridge',b:[
['ol',['Close the **angle valves** under the basin or sink. If there are none, close the room or main valve and **fit angle valves** (recommended).','Open the old tap to release water and pressure.','Place a bucket and towel. Disconnect the flexi hoses. Undo the fixing nut with a basin spanner.','Remove the old tap. Clean the surface.','Check that the new tap suits the hole size and thickness, and the water system: **low-pressure taps** for gravity/low-pressure geysers, high-pressure taps for mains-pressure systems.','Fit the new tap with its washers/seals. Do not over-tighten the fixing nut – ceramic can crack.','Fit **new** flexi hoses. Hot is normally on the left, cold on the right.','**Flush the line:** with the aerator off and the hose not yet connected, open the angle valve into a bucket to clear debris.','Connect hoses. Open valves slowly. Check for leaks at every joint, wipe dry and check again after 10 minutes.','Test the hot and cold: correct side, no mixing at the other tap. Fit the aerator.']],
['chk','c.tap','Tap replacement checklist',['Water off at angle valve or main','New tap matches the basin/sink and the pressure system','New flexi hoses fitted','Hot/cold the right way round','Line flushed before connecting','No leaks at joints (wiped dry and re-checked)','Waste and trap not leaking','Aerator fitted, tap works, basin clean']]
]},
{id:'pr-basinwc',title:'Basin & WC installation',kw:'basin wc toilet pedestal cistern pan trap waste p-trap s-trap close coupled connector rawl',b:[
['h','Basin'],
['ol',['Mark the height and position (usually the rim about 800–850 mm above the floor) and check the wall: solid fixing needed.','Fit the wall bracket or hangers with correct plugs and screws. Basins are heavy: do not trust drywall without a solid board.','Fit the tap and waste on the basin **before** mounting it.','Mount the basin level. Connect the trap and waste pipe with a fall to the waste outlet.','Fit isolating valves and flexi hoses. Run both hot and cold water to flush and test.','Fill the basin and let it run out: check the trap and joints for leaks.']],
['h','WC (toilet)'],
['ol',['Check the outlet type: **P-trap** (to the wall) or **S-trap** (to the floor) and the distance from wall to the centre of the outlet.','Fit the **WC connector** or push-fit soil connection to the drain (110 mm). Clean the pipe end and lubricate the seal.','Set the pan, mark and drill the floor fixing holes. Use plugs/anchors appropriate to the floor.','Fix the pan with the correct bolts and rubber/plastic washers. **Do not over-tighten** – porcelain cracks.','Fit the cistern (close-coupled: seal and bolts; wall-hung: bracket and flush pipe).','Connect the water supply: an **angle valve** and a flexi hose to the cistern inlet.','Flush several times. Check the water level, fill valve cutoff, flush volume and every joint for leaks.','Seal around the base with sanitary silicone if the customer wants it, leaving the back or sides as the maker advises.','Test the trap water seal: the trap must hold water in the bowl (see SANS notes).']],
['chk','c.basinwc','Basin & WC checklist',['Wall/floor solid for fixings','Fixtures level and secure; not over-tightened','Waste and trap with correct fall and no leaks','Push-fit seals clean and lubricated','Isolating valves and flexi hoses fitted','Water supply tested; no leaks after 10 minutes','Cistern fills and cuts off at the right level; flush works','Basin and WC wiped clean; protective plastic removed','Customer shown the isolating valves']]
]},
{id:'pr-drain',title:'Blocked drain & gully',kw:'blocked drain gully clear rod jetter plunger rodding eye manhole sewer blockage grease hair',b:[
['ol',['Ask which fixtures are blocked. **One fixture** = blockage in its trap or branch. **Several fixtures** or the gully overflowing = blockage in the main drain.','Wear waterproof gloves and glasses. Protect floors.','**Basin or sink:** put a bucket under, unscrew the trap and clean it. Reassemble with sound seals.','**WC:** try a plunger first. If it does not clear, use a closet auger. Do not use harsh chemicals.','**Gully or main drain:** lift the gully grid, remove silt and rubbish. Open the nearest **rodding eye** or inspection chamber (open slowly, keep your face away).','Find where the water stops: flow before the blockage point, dry after.','Use drain rods or an electric drain machine from the open point toward the blockage. Work gently, do not force the rods in a bend.','Flush with plenty of water to check the line is free.','If it blocks again, or the pipe is cracked, collapsed or full of roots: inspect with a drain camera and quote the repair.','Disinfect the area and tools. Photograph the pipe or what was found.','Advise the customer: no grease, wipes, nappies or sanitary products down the drain; use hair catchers in showers; clean gullies regularly.']],
['warn','Never enter a manhole or sewer chamber (gas). Do not mix drain-cleaning chemicals.'],
['chk','c.drain','Blocked drain checklist',['Which fixtures are affected? (branch or main?)','PPE on (gloves, glasses)','Blockage cleared and flow tested with water','Gully, trap and rodding eyes checked and refitted','Cause found (hair, grease, roots, collapse) and photographed','Customer advised how to prevent it','Area cleaned and disinfected','Further inspection/repair quoted if needed']]
]},
{id:'pr-bathroom',title:'Bathroom rough-in',kw:'bathroom rough in rough-in new build walls shower bath basin wc pipes before tiling concealed',b:[
['p','“Rough-in” is the pipework in walls and floors **before** tiling and fixtures. Mistakes here are expensive to fix.'],
['ol',['Get the final **layout and fixture positions** from the customer or builder. Draw them in Plumbing Sketch. Check dimensions on site.','Mark all positions on the walls: basin, bath, shower mixer, WC, towel rail. Check mixer depth and heights against the fixtures’ instructions.','Run the **water supply** (hot and cold) to each fixture with the right pipe and size. Keep hot and cold apart, and insulate the hot pipes.','Fix the pipes firmly with clips so they cannot move when tiled.','Run the **waste and soil pipes** with a continuous fall to the drain. Use two 45° bends rather than a 90° where possible. Keep every trap close to a vent or a ventilated stack. Typical waste sizes: basin 40 mm, bath/shower 50 mm, WC 110 mm.','Leave all isolating valves and any joints **accessible** (access panels).','Cap the ends. Close off drains with test plugs.','**Pressure test** the water pipes (see Pressure testing) and **water test** the drains before walls are closed.','Take photos with a tape measure of every concealed pipe and valve. Send them to Charl and the customer.','Protect the pipes and tell others (builders, tilers) not to drive nails or screws near them.']],
['chk','c.bathroom','Bathroom rough-in checklist',['Layout and heights confirmed in writing/on sketch','Water pipes sized and run with hot insulated','Pipes clipped and fixed','Waste and soil pipes with a continuous fall','Venting checked','Valves/joints accessible','Water pipes pressure tested','Drains water tested','Photos taken with measurements','All ends capped/plugged and protected']]
]},
{id:'pr-points',title:'Kitchen sink, dishwasher & washing machine points',kw:'kitchen sink dishwasher washing machine point standpipe waste tap hose non-return',b:[
['h','Kitchen sink'],
['ul',['Waste is normally 40 mm (50 mm if the sink also takes a dishwasher and washing machine) with a trap.','Fit isolating angle valves on hot and cold.','Fit the sink waste, the trap and a correct fall.']],
['h','Dishwasher'],
['ol',['Cold (and hot if the machine allows) supply from a tee with an isolating valve. Use a valve with a hose connection (¾″ BSP) for the inlet hose.','The drain hose goes to a **sink-trap spigot** or a standpipe with an air gap. A non-return connection stops dirty water running back into the machine.','Raise the drain hose loop as the maker shows, to prevent back-siphoning.']],
['h','Washing machine'],
['ol',['Supply: an isolating valve with a hose connection (¾″ BSP), fixed to the wall at an accessible height. Provide both hot and cold if the machine takes them.','Drain: a **standpipe** with a trap, or a wall-box. The drain hose must **not be pushed in tightly** – leave an air gap.','Standpipe height and size: follow the maker’s instructions and SANS 10252-2.','Check the hose does not kink and is not pinched behind the machine.']],
['sans','Standpipe, trap and air-gap dimensions are set in the drainage standard. Check them for each job.'],
['chk','c.points','Appliance points checklist',['Isolating valves fitted and accessible','Waste size and trap correct; fall to the drain','Standpipe/trap or spigot with non-return fitted','Drain hose air gap/loop done','Supply hoses connected and leak-free','Machine run through a full cycle with no leaks','Customer shown the isolating valves']]
]},
{id:'pr-outside',title:'Outside taps & backflow',kw:'outside tap garden tap irrigation hose backflow vacuum breaker borehole frost',b:[
['ol',['Pick a position that suits the customer and is easy to reach.','Run the pipe from the cold supply. Fit an **isolating valve** inside the house or at an accessible point so the tap can be isolated for repairs.','Fix the pipe with clips. Pass through the wall with a sleeve, seal the hole on both sides.','Fit the tap on a wall plate firmly. Fit a **hose union vacuum breaker** or a tap with built-in backflow protection where a hose is used.','Turn on slowly, check for leaks, and flush debris out first.','On the Highveld, **frost** can burst exposed pipes: insulate exposed pipes and tell the customer to close and drain the tap in winter.']],
['h','Backflow'],
['p','Backflow is when dirty water flows backwards into the clean water supply. It can happen if the mains pressure drops while a hose is in a pool, a bucket, a pesticide tank or a borehole tank.'],
['ul',['Fit the correct backflow prevention (vacuum breaker, double check valve) wherever there is a cross-connection risk: irrigation, pool filling, hoses, boreholes, tanks.','Never connect a borehole or tank directly to the municipal mains without an approved arrangement.']],
['sans','Backflow prevention is required under the water supply standard. Check the requirements and the municipal by-laws.'],
['chk','c.outside','Outside tap checklist',['Isolating valve fitted and accessible','Pipe fixed and sleeved through the wall','Wall seal made weatherproof','Tap fixed firmly; vacuum breaker/backflow protection fitted','No leaks; flow tested','Exposed pipe insulated against frost','Customer told about winter care']]
]},
{id:'pr-sewer',title:'Septic tank & sewer connection',kw:'septic tank sewer connection soakaway manhole inspection chamber junction trench uPVC 110 municipal',b:[
['warn','Most sewer and septic work needs municipal approval, plans or inspections. Never connect to a sewer without permission. Excavations: see Trenches.'],
['ol',['Find out: is the property on the **municipal sewer** or a **septic tank**? Get the sewer plan from the owner or municipality.','Locate the connection point, inspection chamber or manhole. Check **levels**: the new drain must have a fall to the connection.','Plan the route. Keep it straight with as few bends as possible. Use rodding eyes or inspection chambers at changes of direction.','Check for other services before you dig.','Dig the trench with the sides safe. Make a firm, level **bed** of sand or fine gravel.','Lay uPVC 110 mm sewer pipe with socket upstream (pointing up the slope) and the correct **fall** (see SANS quick guide). Check with a spirit level or laser.','Connect to the sewer with a **45° junction** (Y) at the top half of the main pipe. Seal properly. Use an approved saddle or chamber as required.','Fit access (rodding eyes or inspection chambers) as required.','**Test** the drain with water or air before covering it (see Pressure testing).','**Photograph** the pipes and measure the depths and distances from fixed points. Have the municipality inspect it if required.','Surround with bedding, then backfill in layers.']],
['h','Septic tank'],
['ul',['The tank must be the right size and approved, with an outlet to a soakaway or other approved disposal.','The tank must be vented. Do not drain stormwater into it.','Needs regular de-sludging by a licensed service.']],
['verify','Check the requirements with the local municipality (Krugersdorp, Pretoria, Edenvale each differ) and the plan approval.'],
['chk','c.sewer','Sewer / septic connection checklist',['Permission and plans confirmed','Services located; trench safe','Bed level with correct fall','Correct pipe, junction and fittings','Access points installed','Water/air test passed','Photos with measurements','Municipal inspection arranged (if required)','Backfill in layers; surface made good']]
]},
{id:'pr-testing',title:'Pressure testing',kw:'pressure test gauge hydrostatic drain test water test air test hold leak 1.5 times',b:[
['h','Water supply pipes'],
['ol',['Flush the pipes with clean water to remove debris.','Close all taps and valves. Isolate fittings that must not see test pressure: geysers, pressure control valves, taps.','Fill the system slowly from one end. Open a high point to bleed all air.','Connect a **test pump and a calibrated pressure gauge** at the lowest practical point.','Raise the pressure to the **test pressure** for the pipe and standard. Do not exceed the lowest-rated component or the pipe maker’s limit.','Hold the pressure. Watch the gauge and look at every joint. A falling gauge needs a leak check. Plastic and multilayer pipes may need re-pumping – follow the maker’s instructions.','Record the pressure, time and result, photograph the gauge.','Release the pressure slowly. Reconnect the fittings.']],
['sans','Test pressure and hold time: the common practice is about 1.5 times the working pressure, held for the time required. The exact figures are set in SANS 10252-1 and by the pipe/fittings maker.'],
['h','Drains'],
['ol',['Plug the lower open end with a test plug.','Fill the drain with water up to a safe level (for example up to the highest point the drain is going to be loaded, or as required by the standard/inspector).','Wait the required time. Level should not drop. Check joints for seepage.','Alternatively, do an **air test** with an approved test kit.','Release and remove plugs. Record the result.']],
['verify','Confirm the test pressure, test time and procedure in the current standard before relying on these figures.'],
['chk','c.test','Pressure test checklist',['Pipes flushed','Components not rated for test pressure isolated','Air bled from the system','Calibrated gauge fitted and photographed','Test pressure applied (per standard/maker)','Held for the required time, no drop','All joints inspected','Drains water tested before covering','Result recorded; pressure released safely']]
]}
]});

{id:'ref-copper',title:'Copper',kw:'copper tube capillary solder compression end feed solder ring 15 22 28 flux',b:[
['table',['Nominal size (outside diameter)','Typical use'],[['15 mm','Basins, taps, WC, appliance branches'],['22 mm','Branch lines, bath, geyser connections'],['28 mm','Main house supply, risers, geyser to manifold'],['35, 42, 54 mm','Larger supplies, commercial']]],
['h','Joining'],
['ul',['**Capillary (solder-ring or end-feed):** cut square, deburr, clean bright with a pad, flux, heat evenly and feed solder. Wipe off the excess flux while warm.','**Compression:** cut, deburr, slide on nut and olive, push in fully, tighten (do not overtighten).','**Press fit:** use the correct tool and check each jaw for full pressing.','Bend with a spring or bender – do not kink.']],
['ul',['Use solder and flux that is approved for **drinking water** (lead-free).','Never put galvanised pipe after (downstream of) copper without a dielectric or brass fitting: the copper ions corrode the galvanised.','Support copper at the right spacing (see support spacing).','Copper tube is made to a SANS standard in different wall thicknesses (classes). Check the class for your job.']],

{id:'ref-upvc',title:'uPVC (waste & soil)',kw:'upvc pvc waste soil solvent cement push-fit rubber ring 32 40 50 75 110 bend junction vent',b:[

['note','Sizes above are typical site practice. The standard sets minimum pipe sizes for each fixture. Check SANS 10252-2.'],
['h','Joining'],
['ul',['**Solvent weld (glue):** cut square, deburr, bevel the end, clean, apply cement to both surfaces, push in fully with a slight twist, hold for 30 seconds. Allow it to cure before testing.','**Push-fit (rubber ring):** clean and lubricate with the maker’s lubricant. Mark the insertion depth. Leave a small expansion gap (usually 10 mm) in long runs.','Use correct fittings: long-radius bends, 45° junctions, access (rodding) points.','Keep away from heat (flue pipes, hot water pipe).','uPVC soil/waste products must carry the SANS mark (SANS 967).']],
['verify','Check the mark and the SANS standard number on the pipe you buy.']
]},
{id:'ref-hdpe',title:'HDPE (polyethylene)',kw:'hdpe polyethylene poly pipe blue black underground compression electrofusion irrigation 20 25 32 40 50 63',b:[
['table',['Size','Typical use'],[['20, 25 mm','Garden and small supply lines'],['32, 40 mm','House supply from the meter'],['50, 63 mm','Larger supply, boreholes, farm lines']]],
['h','Joining'],
['ul',['**Compression fittings** (most common on site): cut square, chamfer the end, insert the stiffener where the maker requires it, push in and tighten the nut.','**Electrofusion and butt-welding:** specialist tools and training required.','Use pipe and fittings rated for **potable water** and the working pressure (PN / class rating).']],
['ul',['HDPE expands and moves with temperature: allow slack when laying.','Bury at the depth required, in a sand bed, and mark the route (warning tape).','Do not use for hot water.','Do not use outside in direct sunlight unless it is black UV-stabilised pipe.']]
]},
{id:'ref-pex',title:'PEX / multilayer',kw:'pex multilayer composite pex-al-pex aluminium press fitting hot cold manifold 16 20 26 32',b:[
['table',['Size','Typical use'],[['16 mm','Basins, taps, appliances'],['20 mm','Showers, baths, branches'],['26 mm','Main lines and manifold feeds'],['32 mm','Large mains']]],
['h','Joining'],
['ul',['**Compression fittings:** cut square with the proper cutter, calibrate/ream the end with the maker’s tool, fit the insert and ferrule the way the maker shows, tighten.','**Press fittings:** use the correct jaws and press tool, and mark the insertion depth.','**Bend** with the correct spring or bending tool. Do not kink – multilayer holds its shape.']],
['ul',['Use pipe and fittings **from the same system** (brand and size). Do not mix brands unless the maker says it is OK.','Check the temperature and pressure ratings for hot water.','Protect from UV and from nails and screws.','Keep pipe in conduit or sleeves in walls where required by the maker.']],
['verify','Follow the maker’s instructions for each brand.']
]},
{id:'ref-galv',title:'Galvanised steel',kw:'galvanised galvanized steel threaded bsp thread hemp ptfe union nipple old pipes',b:[
['table',['Nominal size','Typical use'],[['½″ (15 mm)','Branches'],['¾″ (20 mm)','Supply lines'],['1″ (25 mm)','Main supply'],['1¼″, 1½″, 2″','Larger mains']]],
['h','Joining'],
['ul',['Threaded (BSP) joints with PTFE tape or hemp and jointing paste.','Use pipe wrenches. Hold the fitting so you do not twist the old pipe.','Use unions so a section can be removed.']],
['ul',['Galvanised pipe corrodes from the inside and restricts flow. When replacing sections, plan to replace more than just the leaking spot.','Do not join copper directly to galvanised. Use a brass or dielectric fitting.','Old pipe may be hard to unscrew. Try penetrating oil and heat only if it is safe (water drained).']]
]},

{id:'sans-falls',title:'Minimum waste falls',kw:'fall slope gradient 1:46 1:40 1:60 waste soil branch table 15 drain gradient',b:[
['sans','Minimum falls from SANS 10252-2 Table 15:'],
['table',['Pipe','Minimum fall'],[['Waste branches','1 : 46'],['Soil branches','1 : 40']],true],
['sans','Common site practice of 1 : 40 for 50 mm pipes and 1 : 60 for 110 mm pipes is **not** the standard. Check the current standard before you rely on it.'],
['p','1 : 46 means the pipe falls 1 unit for every 46 units of length. For 1 metre of pipe that is 1000 ÷ 46 = about **21.7 mm**. For 1 : 40 it is **25 mm** per metre.'],

{id:'sans-vent',title:'Venting',kw:'vent venting trap 6 m 10 m stack ventilated air siphon',b:[

['sans','For waste fixtures this can be extended up to **10 m** if the pipe is **one size larger**.'],
['ul',['Vents let air into the drain so traps do not siphon empty, and let sewer gas out.','Long horizontal runs and wrong sizes can cause gurgling and smells.','Trap water seals must not be lost.']],
['verify','Check the other rules (vent sizes, connection heights, anti-siphon valves) in SANS 10252-2.']
]},
{id:'sans-geyser',title:'Geyser safety valve drain',kw:'geyser safety valve drain t&p discharge pipe metal bends fall visible outside',b:[

['sans','Its size must be **at least the size of the valve outlet**.'],
['sans','It must have a **continuous fall** (no upward sections) to the outside.'],
['sans','It must have **no more than 3 bends**.'],
['sans','It must discharge in a place where the discharge can be **seen** outside, clear of people.'],
['ul',['Never fit a valve, cap or plug in the drain pipe.','If it drips all the time, find out why: high water pressure, a faulty valve, or an overheating geyser.','Fit a drip tray with its own drain pipe where a leak can cause damage.']],

{id:'sans-support',title:'Pipe support spacing',kw:'support spacing clips brackets uPVC waste horizontal vertical 0.6 1.5',b:[

['verify','The other spacing figures in the app are typical trade values, not from the standard. Check the maker or SANS 10252-1.'],
['goto','Open the support spacing lookup','calc-support']
]},
{id:'sans-pirb',title:'PIRB & Certificate of Compliance',kw:'pirb certificate of compliance coc plumbing registered licensed plumber insurance',b:[
['verify','Verify everything on this page with PIRB and your municipality.'],
['ul',['**PIRB** is the Plumbing Industry Registration Board. It registers plumbers and licenses them.','Some work needs a **Plumbing Certificate of Compliance (CoC)**, which can be issued only by a **licensed** plumber. A geyser installation or replacement is the common one.','Insurers often require the plumbing CoC when a claim for a geyser is made or a new geyser is fitted.','The electrical part of a geyser job needs a separate **Electrical CoC** from a registered electrical person.','Keep a copy of every certificate with photos of the job.','Add your own PIRB registration number under Contacts & company details.']],
['goto','Add PIRB number','co-details']
]}
]});

var IDX=[];
function buildIndex(){
 ORDER.forEach(function(p){
  var parts=[];
  p.b.forEach(function(b){
   switch(b[0]){
    case 'h':case 'p':case 'note':case 'warn':case 'sans':case 'verify':parts.push(plain(b[1]));break;
    case 'ul':case 'ol':b[1].forEach(function(x){parts.push(plain(x))});break;
    case 'chk':parts.push(b[2]);b[3].forEach(function(x){parts.push(plain(x))});break;
    case 'table':b[1].forEach(function(x){parts.push(x)});b[2].forEach(function(r){r.forEach(function(c){parts.push(plain(c))})});break;
    case 'fields':case 'form':parts.push(b[2]);b[3].forEach(function(f){parts.push(f[1])});break;
    case 'tpl':parts.push(b[2]);parts.push(b[3].replace(/\{\{[\w.]+\}\}/g,''));break;
    case 'link':case 'goto':parts.push(b[1]);break;
    case 'calc':parts.push(p.title);break}});
  var text=parts.join(' \u2022 ');
  IDX.push({p:p,title:p.title.toLowerCase(),sec:p.sec.title.toLowerCase(),kw:(p.kw||'').toLowerCase(),text:text,low:text.toLowerCase()})})}
function search(q){
 var toks=q.toLowerCase().split(/\s+/).filter(Boolean);if(!toks.length)return [];
 var res=[];
 IDX.forEach(function(e){
  var score=0,ok=true;
  toks.forEach(function(t){var inT=e.title.indexOf(t)>=0,inK=e.kw.indexOf(t)>=0,inS=e.sec.indexOf(t)>=0,inB=e.low.indexOf(t)>=0;
   if(!(inT||inK||inS||inB)){ok=false;return}
   score+=(inT?20:0)+(inK?8:0)+(inS?3:0)+(inB?Math.min(6,e.low.split(t).length-1):0)});
  if(ok)res.push({e:e,score:score})});
 res.sort(function(a,b){return b.score-a.score});return res}
function snippet(e,toks){
 var pos=-1;for(var i=0;i<toks.length&&pos<0;i++)pos=e.low.indexOf(toks[i]);
 if(pos<0)return '';var s=Math.max(0,pos-45),en=Math.min(e.text.length,pos+90);
 var t=(s>0?'\u2026':'')+e.text.slice(s,en)+(en<e.text.length?'\u2026':'');
 var out=esc(t);toks.forEach(function(k){if(!k)return;out=out.replace(new RegExp('('+esc(k).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});return out}
