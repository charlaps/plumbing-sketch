SECTIONS.push({id:'trouble',title:'Troubleshooting',blurb:'No hot water, low pressure, leaks, slow drains, noise, damp',icon:'warn',pages:[
{id:'tr-hot',title:'No hot water',kw:'no hot water geyser cold element thermostat tripped breaker timer',b:[
['warn','Electrical faults (breaker, thermostat, element) must be dealt with by a registered electrical person. Plumbers check the water side.'],
['table',['Check','Likely cause','What to do'],[['Is the water cold everywhere?','Geyser has no power or has failed','Check the DB breaker and isolator. Reset a tripped breaker once only. Call the electrician if it trips again.'],['Is the geyser warm but low on hot?','Small geyser, scale on the element, thermostat too low','Check size vs demand. Flush the geyser. Electrician checks element/thermostat.'],['Cold only at one tap?','Mixer/cartridge fault or crossed hot/cold','Check the tap and flexi hoses.'],['Hot water runs out quickly?','Failing element, thermostat or timer, pipes losing heat','Electrician tests. Check the timer, insulate the pipes.'],['Is the geyser full of water?','Isolating valve closed, supply off','Open the isolating valve. Do not switch on a dry geyser.'],['Water not hot enough or too hot?','Thermostat set wrong or faulty','Set to about 60 °C. Electrician replaces a faulty thermostat. Check the safety valve.']]]
]},
{id:'tr-pressure',title:'Low water pressure',kw:'low pressure weak flow trickle slow isolating valve blocked aerator pressure reducing valve',b:[
['table',['Check','Likely cause','What to do'],[['Low at all taps?','Municipal supply problem, partly closed main valve, faulty pressure valve','Check the outside tap and the street meter. Open the valves fully. Check the pressure control valve.'],['Low at one tap?','Blocked aerator or flexi hose, partly closed angle valve','Remove and clean the aerator. Replace the hose.'],['Low hot only?','Geyser valves or hot pipe restricted, or the geyser’s low-pressure system','Check the non-return valve, valve strainer and pipe size.'],['Gets worse over time?','Corroded galvanised pipe, scale','Check inside pipe. Quote replacement.'],['Low only at certain times?','Peak demand in the area, neighbours','Check with a gauge morning and evening. Consider a tank and pump.'],['Pressure good but flow poor?','Pipe too small, restricted valve','Check pipe size and any strainers.']]]
]},
{id:'tr-geyserleak',title:'Leaking geyser',kw:'leaking geyser leak drip tray safety valve dripping overflow corrosion',b:[
['table',['Where is it leaking?','Likely cause','What to do'],[['From the safety valve drain pipe, constantly','Supply pressure too high, faulty valve, thermostat/overheating','Check pressure with a gauge. Fit or adjust the pressure control valve. Replace the valve. Electrician checks the thermostat.'],['From the safety valve drain pipe, small drips only while heating','Thermal expansion in a closed system (non-return valve fitted)','A little is common. If it is more than a small drip, check the pressure and the expansion arrangement the maker requires.'],['From pipe connections','Loose or old joints','Isolate, drain, remake with new seals.'],['From the element flange or thermostat cover','Perished seal or loose bolts','Isolate power and water, replace the seal (electrician).'],['From the geyser body or in the drip tray','Corroded cylinder','The geyser is finished. Replace it. Turn off the water to limit damage.'],['Ceiling stain under the geyser','Any of the above','Check the drip tray and the tray’s drain pipe.']]]
]},
{id:'tr-drain',title:'Slow drain',kw:'slow drain gurgling smell blockage trap vent fall roots',b:[
['table',['Check','Likely cause','What to do'],[['One fixture slow?','Trap or branch blocked (hair, soap, grease)','Clean the trap, plunge, rod the branch.'],['Several fixtures slow?','Main drain partly blocked','Rod or jet from the rodding eye. Camera inspection.'],['Gurgling noises?','Partial blockage or blocked or missing vent','Clear the drain. Check the vent. Check trap size and distance.'],['Smell from drain?','Dry trap or lost water seal, no vent, cracked pipe','Refill the trap. Check venting and the pipe.'],['Gully overflows?','Silt or blockage downstream','Clean the gully and rod the line.'],['Keeps blocking?','Roots, collapsed or bellied pipe, insufficient fall','Camera inspection and quote for repair.']]]
]},
{id:'tr-toilet',title:'Running toilet',kw:'running toilet cistern float valve flush valve inlet leaking wc overflow',b:[
['table',['Check','Likely cause','What to do'],[['Water trickles into the bowl all the time?','Flush valve seal perished or dirty','Clean or replace the seal or valve. Dye test: colour in the bowl without a flush.'],['Water runs into the overflow?','Fill valve / float set too high or faulty','Adjust the float. Replace the fill valve.'],['Cistern fills very slowly?','Blocked inlet filter or low supply','Clean the filter. Check the angle valve is fully open.'],['Toilet “phantom flushes”?','Slow flush leak','Replace the flush valve seal.'],['Noise when filling?','Worn fill valve','Replace the fill valve.'],['Water on the floor?','Leaking cistern connection, cracked cistern, loose flexi hose','Check the joints, wipe dry and watch.']]]
]},
{id:'tr-noise',title:'Noisy pipes',kw:'noisy pipes water hammer banging clicking whistle vibrating hammer arrester',b:[
['table',['Noise','Likely cause','What to do'],[['Bang when a tap closes (water hammer)','High pressure, fast-closing valves, loose pipes','Check pressure. Fit a pressure control valve. Fix pipes with clips. Fit a water hammer arrester.'],['Clicking when the geyser heats','Pipes expanding in clips and sleeves','Loosen or pad the clips; add sleeves.'],['Whistling or squealing','Partly closed valve, worn washer, high flow','Open valves fully, replace washers or cartridges.'],['Rattle or vibration','Pipes touching walls or each other','Add clips and pads.'],['Banging when a cistern fills','Faulty fill valve','Replace the fill valve.'],['Noise from a pump','Air in the pump, bad mountings','Bleed and check the mounting and pump.']]]
]},
{id:'tr-damp',title:'Damp patches',kw:'damp patch wall ceiling stain mould leak rising damp condensation roof',b:[
['table',['Check','Likely cause','What to do'],[['Do a meter test with all taps closed','Hidden pressure leak if the meter moves','Isolate sections and find the leak.'],['Damp near a bathroom or shower wall','Failing seals or grout, leaking shower tray, or waste','Check the shower, sealant and traps with a water test.'],['Ceiling stain under a bath or geyser','Pipe, trap, overflow or drip tray leak','Check the traps and the geyser tray.'],['Damp at the bottom of walls outside','Rising damp or a leaking gutter, gully or garden tap','Check drainage, gutters, outside taps.'],['Wet floor in a kitchen','Leaking sink trap, hose or dishwasher connection','Check and dry the joints.'],['Damp only after rain','Roof, flashing or gutter leak','Not plumbing: advise a roofer.'],['Misty windows and surface damp','Condensation','Advise ventilation.']]],
['note','Take photos and note the date. Let the customer know drying can take weeks and that we do not repair paint or plaster unless it is quoted.']
]}
]});

/* ---------- search ---------- */
var IDX=[];
function buildIndex(){
 ORDER.forEach(function(p){
  var parts=[];
  p.b.forEach(function(b){
   switch(b[0]){
    case 'h':case 'p':case 'note':case 'warn':case 'sans':case 'verify':parts.push(plain(b[1]));break;
    case 'ul':case 'ol':b[1].forEach(function(x){parts.push(plain(x))});break;
    case 'chk':parts.push(b[2]);b[3].forEach(function(x){parts.push(plain(x))});break;
    case 'table':b[1].forEach(function(x){parts.push(x)});b[2].forEach(function(r){r.forEach(function(c){parts.push(plain(c))})});break;
    case 'fields':case 'form':parts.push(b[2]);b[3].forEach(function(f){parts.push(f[1])});break;
    case 'tpl':parts.push(b[2]);parts.push(b[3].replace(/\{\{[\w.]+\}\}/g,''));break;
    case 'link':case 'goto':parts.push(b[1]);break;
    case 'calc':parts.push(p.title);break}});
  var text=parts.join(' \u2022 ');
  IDX.push({p:p,title:p.title.toLowerCase(),sec:p.sec.title.toLowerCase(),kw:(p.kw||'').toLowerCase(),text:text,low:text.toLowerCase()})})}
function search(q){
 var toks=q.toLowerCase().split(/\s+/).filter(Boolean);if(!toks.length)return [];
 var res=[];
 IDX.forEach(function(e){
  var score=0,ok=true;
  toks.forEach(function(t){var inT=e.title.indexOf(t)>=0,inK=e.kw.indexOf(t)>=0,inS=e.sec.indexOf(t)>=0,inB=e.low.indexOf(t)>=0;
   if(!(inT||inK||inS||inB)){ok=false;return}
   score+=(inT?20:0)+(inK?8:0)+(inS?3:0)+(inB?Math.min(6,e.low.split(t).length-1):0)});
  if(ok)res.push({e:e,score:score})});
 res.sort(function(a,b){return b.score-a.score});return res}
function snippet(e,toks){
 var pos=-1;for(var i=0;i<toks.length&&pos<0;i++)pos=e.low.indexOf(toks[i]);
 if(pos<0)return '';var s=Math.max(0,pos-45),en=Math.min(e.text.length,pos+90);
 var t=(s>0?'\u2026':'')+e.text.slice(s,en)+(en<e.text.length?'\u2026':'');
 var out=esc(t);toks.forEach(function(k){if(!k)return;out=out.replace(new RegExp('('+esc(k).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});return out}
