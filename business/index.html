<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d5224">
<meta name="description" content="Corner & Co is a hands-on South African shop game. Walk the floor, scan at the till, stock shelves, and grow. Prices are game values in rand.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Corner & Co">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Corner &amp; Co</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #16324a; overflow: hidden; }
body {
  font-family: system-ui, "Segoe UI", sans-serif;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
}
#app { height: 100dvh; height: 100%; }
canvas {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  background: #8ecaf2;
}
</style>
</head>
<body>
<div id="app"><canvas id="c"></canvas></div>
<script src="game.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', {scope: './'}).catch(function () {});
}
</script>
</body>
</html>
