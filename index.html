<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(function(){
  var h=location.hash||'';
  var q=location.search||'';
  var sketch=/^#job=/.test(h)||/(?:^|[?&])source=pwa(?:&|$)/.test(q);
  var dest=sketch?('field/sketch/'+q+h):'field/';
  var link=document.getElementById('moved');
  if(link)link.setAttribute('href',dest);
  location.replace(dest);
})();
</script>
<meta http-equiv="refresh" content="0;url=field/">
<title>Plumbing Sketch has moved to the APS Field App</title>
<link rel="canonical" href="field/">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f4f7fc;color:#082464;font-family:Montserrat,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}
  a{color:#004AAD;font-weight:700;font-size:1.15rem;line-height:1.45}
  p{margin:0 0 16px}
</style>
</head>
<body>
<p><a id="moved" href="field/">Plumbing Sketch has moved to the APS Field App</a></p>
<p><a href="field/sketch/">Open the sketch</a></p>
<script>
(function(){
  var h=location.hash||'', q=location.search||'';
  if(/^#job=/.test(h)||/(?:^|[?&])source=pwa(?:&|$)/.test(q)){
    var dest='field/sketch/'+q+h;
    var link=document.getElementById('moved');
    if(link){link.href=dest;link.textContent='Plumbing Sketch has moved into the APS Field App';}
  }
})();
</script>
</body>
</html>
