<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plumb Sketch">
<meta name="theme-color" content="#0b3d6e">
<meta name="description" content="Plumbing job sketch pad – draw pipe diagrams and share them on WhatsApp.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Plumbing Sketch</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#fff;color:#12263a;touch-action:none;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{display:grid;height:100vh;height:100dvh;grid-template-columns:100%;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "stage" "opts" "tools"}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;touch-action:manipulation;cursor:pointer}
svg.ic{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{grid-area:top;background:#0b3d6e;color:#fff;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;display:flex;gap:6px;align-items:center}
#title{flex:1;min-width:0;height:48px;border-radius:12px;border:0;padding:0 12px;font-size:16px;font-family:inherit;
  color:#12263a;background:#fff;-webkit-user-select:text;user-select:text;outline:none;touch-action:manipulation}
.topbtn{height:48px;min-width:48px;border-radius:12px;background:rgba(255,255,255,.16);font-weight:800;font-size:13px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;padding:0 8px;color:#fff;flex:none}
.topbtn:active{background:rgba(255,255,255,.3)}
#dateBtn.on{background:#ffc83d;color:#12263a}
#shareBtn{background:#25d366;color:#04361a;flex-direction:row;gap:6px;padding:0 14px;font-size:16px}
#shareBtn:active{background:#1fb858}
#stage{grid-area:stage;position:relative;min-height:0;background:#fff;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
#fab{position:absolute;right:8px;bottom:84px;display:flex;flex-direction:column;gap:8px}
.fb{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#0b3d6e;
  font-size:10px;font-weight:800;flex-direction:column;border:1px solid #d3dbe4}
.fb:active{background:#e6efff}
.fb:disabled{opacity:.35;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#selbar{position:absolute;left:6px;right:6px;bottom:8px;display:none;gap:2px;background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.35);
  padding:4px;overflow-x:auto;touch-action:pan-x;border:1px solid #d3dbe4}
#selbar.show{display:flex}
#selbar button{flex:1 0 54px;min-width:54px;max-width:78px;height:60px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;font-size:11px;font-weight:700;color:#24415e}
#selbar button:active{background:#e6efff}
#selbar button.del{color:#d0202f}
#selbar .cdot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #8fa0b2}
#hud{position:absolute;left:8px;top:8px;background:rgba(18,38,58,.85);color:#fff;font-size:13px;font-weight:700;padding:5px 10px;border-radius:10px;display:none;pointer-events:none}
#opts{grid-area:opts;background:#f3f6f9;border-top:1px solid #d3dbe4;height:82px;display:flex;align-items:center;gap:8px;padding:6px 10px;
  overflow-x:auto;overflow-y:hidden;touch-action:pan-x;-webkit-overflow-scrolling:touch}
#opts.tall{height:172px;flex-direction:column;align-items:stretch;gap:4px;padding:6px 0 6px;overflow:hidden}
#opts .row1{display:flex;gap:8px;align-items:center;overflow-x:auto;touch-action:pan-x;padding:0 10px;flex:none}
#opts .sep{width:1px;align-self:stretch;background:#c9d3de;margin:8px 2px;flex:none}
#opts .hint{font-size:14px;color:#4c6480;font-weight:600;line-height:1.25;flex:none;max-width:70vw}
.sw{width:48px;height:48px;border-radius:50%;flex:none;border:3px solid #fff;box-shadow:0 0 0 1px #8fa0b2}
.sw.on{box-shadow:0 0 0 4px #0b5fff}
.sz{width:52px;height:52px;border-radius:12px;background:#fff;border:2px solid #c6d1dc;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;gap:2px}
.sz.on{border-color:#0b5fff;background:#e6efff}
.sz i{display:block;background:#12263a;border-radius:50%}
.sz i.bar{border-radius:2px;width:30px}
.sz b{font-size:13px;color:#12263a}
.sz.tp{width:auto;min-width:64px;padding:0 8px}
.sz.tp span{font-size:11px;font-weight:800;color:#24415e;white-space:nowrap}
.tabs button{flex:none;height:40px;padding:0 14px;border-radius:20px;background:#e3eaf2;font-weight:800;font-size:14px;color:#3a5470;white-space:nowrap}
.tabs button.on{background:#0b5fff;color:#fff}
.tabs button.pill{background:#fff7d6;border:2px solid #e6b400;color:#12263a;display:flex;align-items:center;gap:6px}
.tabs .dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.3)}
.tiles button{flex:none;width:78px;height:88px}
.tile{border-radius:12px;background:#fff;border:2px solid #c6d1dc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:700;color:#24415e;padding:0}
.tile canvas{width:52px;height:52px;pointer-events:none}
.tile span{max-width:74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile:active{background:#e6efff;border-color:#0b5fff}
#tools{grid-area:tools;display:flex;background:#fff;border-top:1px solid #d3dbe4;padding-bottom:env(safe-area-inset-bottom)}
.tbtn{flex:1;min-width:0;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:12px;font-weight:800;color:#4a6280;border-top:3px solid transparent}
.tbtn.on{color:#0b5fff;background:#e6efff;border-top-color:#0b5fff}
.ov{position:fixed;inset:0;background:rgba(10,25,45,.55);display:none;z-index:50}
.ov.show{display:flex}
#dlg{align-items:flex-start;justify-content:center;padding:8vh 14px 0;overflow-y:auto}
.card{background:#fff;border-radius:18px;width:100%;max-width:440px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.card h3,.sbox h3{margin:0 0 10px;font-size:18px}
#dlgInput{width:100%;height:54px;border:2px solid #b8c5d3;border-radius:12px;padding:0 14px;font-size:18px;font-family:inherit;
  -webkit-user-select:text;user-select:text;outline:none;color:#12263a;touch-action:manipulation}
#dlgInput:focus{border-color:#0b5fff}
#dlgChips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{padding:11px 15px;border-radius:22px;background:#e6efff;color:#0b4fd0;font-weight:700;font-size:15px}
.row{display:flex;gap:10px;margin-top:6px}
.row button{flex:1;height:54px;border-radius:12px;font-weight:800;font-size:17px;background:#e9eef4;color:#24415e}
.row button.ok{background:#0b5fff;color:#fff}
#sheet{align-items:flex-end}
.sbox{background:#fff;width:100%;max-height:88dvh;overflow-y:auto;touch-action:pan-y;border-radius:20px 20px 0 0;padding:16px 12px calc(16px + env(safe-area-inset-bottom));}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{display:flex;align-items:center;gap:10px;min-height:60px;padding:6px 12px;border-radius:14px;background:#eef3f8;font-weight:700;font-size:15px;text-align:left;line-height:1.15}
.sbtn small{display:block;font-weight:600;color:#5a7089;font-size:12px}
.sbtn.danger{color:#d0202f}
.sbtn.primary{background:#25d366;color:#04361a}
.sbtn.on{background:#dff5e6}
.sbtn:active{background:#dbe7f5}
.sbox p{font-size:13px;color:#5a7089;margin:12px 4px 0;line-height:1.4}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:rgba(18,38,58,.95);color:#fff;padding:12px 18px;border-radius:14px;
  font-size:15px;font-weight:600;z-index:80;max-width:88%;text-align:center;display:none;pointer-events:none}
#toast.show{display:block}
@media (orientation:landscape) and (max-height:520px){
  #app{grid-template-columns:minmax(0,1fr) 84px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top tools" "stage tools" "opts tools"}
  .top{padding:4px 8px}
  #title,.topbtn{height:42px}
  #tools{flex-direction:column;border-top:0;border-left:1px solid #d3dbe4;padding-bottom:0;padding-right:env(safe-area-inset-right)}
  .tbtn{height:auto;min-height:0;border-top:0;border-left:3px solid transparent;font-size:11px}
  .tbtn.on{border-left-color:#0b5fff}
  #opts{height:70px}
  #opts.tall{height:138px}
  .tile canvas{width:40px;height:40px}
  .tiles button{height:76px}
  #fab{flex-direction:row;right:auto;left:8px;bottom:auto;top:8px}
  .fb{width:46px;height:46px}
  #hud{left:auto;right:8px}
  #selbar button{height:52px}
  #toast{top:56px}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <input id="title" type="text" placeholder="Job title (optional)" maxlength="80" autocomplete="off" enterkeyhint="done">
    <button class="topbtn" id="dateBtn" type="button">Date</button>
    <button class="topbtn" id="shareBtn" type="button"></button>
    <button class="topbtn" id="menuBtn" type="button"></button>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="fab">
      <button class="fb" id="undoBtn" type="button" aria-label="Undo"></button>
      <button class="fb" id="redoBtn" type="button" aria-label="Redo"></button>
      <button class="fb" id="fitBtn" type="button" aria-label="Fit to screen"></button>
      <button class="fb" id="photoBtn" type="button" aria-label="Photo background"></button>
    </div>
    <div id="selbar"></div>
  </main>
  <section id="opts"></section>
  <nav id="tools"></nav>
</div>

<div class="ov" id="dlg"><div class="card">
  <h3 id="dlgTitle"></h3>
  <input id="dlgInput" type="text" autocomplete="off" enterkeyhint="done">
  <div id="dlgChips"></div>
  <div class="row"><button type="button" id="dlgCancel">Skip</button><button type="button" class="ok" id="dlgOk">OK</button></div>
</div></div>
<div class="ov" id="sheet"><div class="sbox" id="sheetBox"></div></div>
<div id="toast"></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" hidden>

<script>

/* ---------- state ---------- */
var S={title:'',showDate:false,items:[],bg:null,legend:false,grid:false};
var bgImg=null, bgSaved=null;

/* ---------- view / geometry ---------- */
function clone(o){return JSON.parse(JSON.stringify(o))}

function pt(e){var r=cv.getBoundingClientRect();return s2w(e.clientX-r.left,e.clientY-r.top)}

function clampView(){V.z=Math.max(0.04,Math.min(8,V.z))}
function segDist(p,a,b){var dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;var t=l?((p.x-a.x)*dx+(p.y-a.y)*dy)/l:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy))}
function worldOff(it,vx,vy){var c=Math.cos(it.r||0),s=Math.sin(it.r||0);return {x:it.x+vx*c-vy*s,y:it.y+vx*s+vy*c}}

function textBox(it){measureCtx.font='700 '+it.size+'px '+FONT;var w=measureCtx.measureText(it.text).width;return {x:it.x-w/2,y:it.y-it.size*0.62,w:w,h:it.size*1.24}}
function stampAABB(it){var d=stampDef(it.k);if(!d)return {x:it.x,y:it.y,w:0,h:0};var g=d.geo(it.mm||50,it.mat||'pvc'),s=it.s||1,r=it.r||0,c=Math.abs(Math.cos(r)),n=Math.abs(Math.sin(r));
  var hw=(c*g.hw+n*g.hh)*K*s,hh=(n*g.hw+c*g.hh)*K*s;return {x:it.x-hw,y:it.y-hh,w:2*hw,h:2*hh}}

  if(it.t==='pipe'){var q=pwid(it)/2+4;if(it.mat==='dim')q=30;var x0=Math.min(it.a.x,it.b.x)-q,y0=Math.min(it.a.y,it.b.y)-q;return {x:x0,y:y0,w:Math.abs(it.a.x-it.b.x)+2*q,h:Math.abs(it.a.y-it.b.y)+2*q}}

}
function boxHalf(it,min){var d=stampDef(it.k),g=d.geo(it.mm||50,it.mat||'pvc'),s=it.s||1;return {x:Math.max(g.hw*K*s+3,min||0),y:Math.max(g.hh*K*s+3,min||0)}}
function hit(it,p,tol){

  if(it.t==='stamp'){var l=toLocal(it,p),b=boxHalf(it,0);return Math.abs(l.x)<=b.x+tol&&Math.abs(l.y)<=b.y+tol}

function drawItems(c){
  var hasErase=S.items.some(function(i){return i.t==='erase'}),grp=[];

async function endDrag(e,cancelled){
  delete ptrs[e.pointerId];
  if(ignore[e.pointerId]){delete ignore[e.pointerId];return}
  if(gest){
    if(Object.keys(ptrs).length<2){Object.keys(ptrs).forEach(function(k){ignore[k]=true});gest=null;hudOff();save();render()}
    return;
  }
  if(!drag||e.pointerId!==drag.id)return;
  var d=drag;drag=null;guide=null;
  try{cv.releasePointerCapture(e.pointerId)}catch(_){}
  if(d.type==='pan'){
    if(!d.moved&&!cancelled&&tool==='move'){setSel(null)}
    save();render();return}
  if(cancelled){S.items=JSON.parse(hist[hi].items);sel=null;updBar();render();return}
  if(d.type==='draw'){commit()}
  else if(d.type==='erase'){if(S.items.indexOf(d.it)>=0&&d.it.pts.length<2){S.items.splice(S.items.indexOf(d.it),1)}commit()}
  else if(d.type==='pipe'){
    if(d.it){
      if(Math.hypot(d.it.a.x-d.it.b.x,d.it.a.y-d.it.b.y)<8/V.z){S.items.splice(S.items.indexOf(d.it),1);render();return}
      render();commit();var pipe=d.it;
      if(pipe.mat!=='dim'&&prefs.ask){
        var ml=measuredLabel(pipe),chips=[ml+' '+matShort(pipe),ml,typeLabel(pipe)];if(pipe.mat==='wall')chips=[ml];
        var l=await askText({title:'Pipe label – length / size',value:'',chips:chips.concat(['Hot','Cold','Waste','Vent']),placeholder:'e.g. 1 m PVC'});
        if(l&&l.trim()){pipe.label=l.trim();commit()}}
      setSel(pipe);
    }
  }
  else if(d.type==='tap'){
    if(!cancelled&&!d.moved){
      var t=await askText({title:'Add text',value:'',chips:['Basin','Toilet','Shower','Hot','Cold','Waste','Vent','Wall','Geyser'],placeholder:'Type your note',cancel:'Cancel'});
      if(t&&t.trim()){S.items.push({t:'text',x:d.p.x,y:d.p.y,text:t.trim(),size:TEXT_S[textI]/V.z,col:col});commit()}
    }
  }
  else if(d.type==='move'){if(d.moved)commit();else render()}
  else{if(JSON.stringify(d.it)!==d.before)commit();else render()}
}

  im.onload=function(){

    URL.revokeObjectURL(url);
    var f=Math.min(cw*0.94/w,ch*0.94/h)/V.z,rw=w*f,rh=h*f,ctr=viewCenter();
    setBg(data,{x:ctr.x-rw/2,y:ctr.y-rh/2,w:rw,h:rh});commit();toast('Photo added – draw on top of it');

    if(i.t==='pipe'&&i.mat!=='dim'){var k=i.mat+':'+i.mm;if(!seen[k]){seen[k]=1;list.push({mat:i.mat,mm:i.mm,col:i.col})}}

function renderExport(){
  var b=contentBounds(),m=70;if(!b)b={x:-200,y:-150,w:400,h:300};
  var wx=b.x-m,wy=b.y-m,ww=Math.max(b.w+2*m,300),wh=Math.max(b.h+2*m,220);

  var leg=S.legend?legendEntries():[],legH=leg.length?(28+leg.length*30):0;
  var Z=Math.max(0.03,Math.min(6,1500/Math.max(ww,wh*0.8)));
  var W=Math.round(ww*Z),Ht=Math.round(wh*Z);
  var lim=3000;if(W>lim||Ht>lim){var q=lim/Math.max(W,Ht);Z*=q;W=Math.round(ww*Z);Ht=Math.round(wh*Z)}
  if(W<720){var up=720/W;Z*=up;W=720;Ht=Math.round(wh*Z)}

  if(HH){x.fillStyle='#0b3d6e';x.fillRect(0,0,W,HH);x.fillStyle='#fff';x.textBaseline='middle';
    var dw=0;if(date){x.font='700 26px '+FONT;dw=x.measureText(date).width;x.textAlign='right';x.fillStyle='#c9dcf2';x.fillText(date,W-20,HH/2)}

/* minimal single-page PDF with the image embedded as JPEG */
function pdfFromCanvas(c){
  var jpg=atob(c.toDataURL('image/jpeg',0.92).split(',')[1]),n=jpg.length,bytes=new Uint8Array(n),i;for(i=0;i<n;i++)bytes[i]=jpg.charCodeAt(i);

  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>');
  var cs='q '+w.toFixed(2)+' 0 0 '+h.toFixed(2)+' '+x.toFixed(2)+' '+y.toFixed(2)+' cm /Im0 Do Q';
  obj(4,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  off[5]=len;put('5 0 obj\n<< /Type /XObject /Subtype /Image /Width '+c.width+' /Height '+c.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+n+' >>\nstream\n');
  parts.push(bytes);len+=n;put('\nendstream\nendobj\n');
  var xr=len;put('xref\n0 6\n0000000000 65535 f \n');for(i=1;i<=5;i++)put(('0000000000'+off[i]).slice(-10)+' 00000 n \n');
  put('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
