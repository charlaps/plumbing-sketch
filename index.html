<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plumb Sketch">
<meta name="theme-color" content="#0b3d6e" id="themeMeta">
<meta name="description" content="Plumbing job sketch pad – draw pipe diagrams and share them on WhatsApp.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Plumbing Sketch</title>
<style>
:root{--bg:#eef2f7;--surface:#fff;--surface2:#f3f6fa;--line:#d5dde7;--text:#12263a;--muted:#5a7089;--brand:#0b3d6e;--brand2:#0f5aa8;--primary:#1259e8;--primary-soft:#e4edff;--danger:#d62839;--ok:#1fb85a;--shadow:0 6px 22px rgba(10,30,60,.22);--chip:#e7edf5;--r:16px}
html[data-theme=dark]{--bg:#0f1720;--surface:#1a2431;--surface2:#222f3f;--line:#33445a;--text:#e8eef6;--muted:#95a8c0;--brand:#0a2540;--brand2:#12467d;--primary:#5b9bff;--primary-soft:#1e3557;--danger:#ff6b78;--chip:#293a50;--shadow:0 6px 24px rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);touch-action:none;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{display:grid;height:100vh;height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "stage" "opts" "tools"}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;touch-action:manipulation;cursor:pointer;transition:background .15s,transform .1s,color .15s,box-shadow .15s}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
svg.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{grid-area:top;background:linear-gradient(180deg,var(--brand),var(--brand2));color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;gap:8px;align-items:center}
#title{flex:1;min-width:0;height:46px;border-radius:14px;border:1.5px solid transparent;padding:0 14px;font-size:16px;font-weight:600;font-family:inherit;
  color:var(--text);background:var(--surface);-webkit-user-select:text;user-select:text;outline:none;touch-action:manipulation}
#title::placeholder{color:var(--muted);font-weight:500}
.topbtn{height:46px;min-width:46px;border-radius:14px;background:rgba(255,255,255,.16);font-weight:800;font-size:13px;display:flex;flex-direction:row;
  align-items:center;justify-content:center;gap:6px;padding:0 10px;color:#fff;flex:none}
.topbtn:active{background:rgba(255,255,255,.32)}
#shareBtn{background:var(--ok);color:#03331a;padding:0 16px;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#stage{grid-area:stage;position:relative;min-height:0;background:#fff;overflow:hidden;margin:0}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
#fab{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:5}
.fb{width:52px;height:52px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--brand2);
  font-size:10px;font-weight:800;flex-direction:column;border:1px solid var(--line);gap:0}
html[data-theme=dark] .fb{color:var(--primary)}
.fb svg.ic{width:24px;height:24px}
.fb:active{background:var(--primary-soft)}
.fb:disabled{opacity:.4;box-shadow:none}
.fb.on{background:var(--primary);color:#fff;border-color:var(--primary)}
#selbar{position:absolute;left:8px;right:72px;bottom:12px;display:none;gap:2px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);
  padding:5px;overflow-x:auto;touch-action:pan-x;border:1px solid var(--line);z-index:6;animation:pop .18s ease-out}
#selbar.show{display:flex}
#selbar button{flex:1 0 52px;min-width:52px;max-width:82px;height:60px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:11px;font-weight:700;color:var(--text)}
#selbar button:active{background:var(--primary-soft)}
#selbar button.del{color:var(--danger)}
#selbar button.act{background:var(--primary-soft);color:var(--primary)}
#selbar .cdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--muted)}
#selbar .sepv{flex:0 0 1px;background:var(--line);margin:8px 3px}
#hud{position:absolute;left:10px;top:10px;background:rgba(18,38,58,.88);color:#fff;font-size:13px;font-weight:700;padding:6px 12px;border-radius:12px;display:none;pointer-events:none}
#modeBadge{position:absolute;left:10px;top:10px;background:var(--primary);color:#fff;font-size:13px;font-weight:800;padding:6px 12px;border-radius:12px;display:none;box-shadow:var(--shadow);z-index:5}
#opts{grid-area:opts;background:var(--surface);border-top:1px solid var(--line);height:84px;display:flex;align-items:center;gap:8px;padding:6px 12px;
  overflow-x:auto;overflow-y:hidden;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#opts::-webkit-scrollbar{display:none}
#opts.tall{height:198px;flex-direction:column;align-items:stretch;gap:6px;padding:8px 0 6px;overflow:hidden}
#opts .row1{display:flex;gap:8px;align-items:center;overflow-x:auto;touch-action:pan-x;padding:0 12px;flex:none;scrollbar-width:none}
#opts .row1::-webkit-scrollbar{display:none}
#opts .sep{width:1px;align-self:stretch;background:var(--line);margin:10px 2px;flex:none}
#opts .hint{font-size:14px;color:var(--muted);font-weight:600;line-height:1.3;flex:none;max-width:72vw}
.sw{width:50px;height:50px;border-radius:50%;flex:none;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--muted)}
.sw.on{box-shadow:0 0 0 4px var(--primary);transform:scale(1.05)}
.sz{width:54px;height:54px;border-radius:14px;background:var(--surface2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;gap:2px;color:var(--text)}
.sz.on{border-color:var(--primary);background:var(--primary-soft)}
.sz i{display:block;background:var(--text);border-radius:50%}
.sz i.bar{border-radius:2px;width:30px}
.sz b{font-size:13px}
.sz.tp{width:auto;min-width:66px;padding:0 10px}
.sz.tp span{font-size:12px;font-weight:800;white-space:nowrap}
.tabs button{flex:none;height:42px;padding:0 16px;border-radius:21px;background:var(--chip);font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button.on{background:var(--primary);color:#fff}
.tabs button.pill{background:#fff3c4;border:2px solid #e6b400;color:#3b2f00}
html[data-theme=dark] .tabs button.pill{background:#4a3d0a;color:#ffe9a1}
.tabs button.srch{background:var(--primary-soft);color:var(--primary)}
.tabs button svg.ic{width:18px;height:18px}
.tile.fav::after{content:'★';position:absolute;top:3px;right:6px;color:#f5a800;font-size:15px;text-shadow:0 0 2px #fff}
#opts .sz.more b{color:var(--primary)}
.tabs .dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.35)}
.tiles button{flex:none;width:80px;height:92px}
.tile{border-radius:16px;background:var(--surface2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--text);padding:0;position:relative}
.tile canvas{width:54px;height:54px;pointer-events:none;background:#fff;border-radius:10px}
.tile span{max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.special{border-color:#4a4436}
.tile:active{border-color:var(--primary);background:var(--primary-soft)}
#tools{grid-area:tools;display:flex;gap:2px;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tbtn{flex:1;min-width:0;height:60px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:12px;font-weight:800;color:var(--muted)}
.tbtn.on{color:var(--primary);background:var(--primary-soft)}
.tbtn.on svg.ic{transform:translateY(-1px) scale(1.08)}
.tbtn svg.ic{transition:transform .15s}
.ov{position:fixed;inset:0;background:rgba(6,16,30,.5);display:none;z-index:50;animation:fade .18s}
.ov.show{display:flex}
#dlg{z-index:60;align-items:flex-start;justify-content:center;padding:8vh 14px 0;overflow-y:auto}
.card{background:var(--surface);border-radius:22px;width:100%;max-width:440px;padding:18px;box-shadow:var(--shadow);animation:pop .2s ease-out}
.card h3,.sbox h3{margin:0 0 12px;font-size:18px}
#dlgInput{width:100%;height:56px;border:2px solid var(--line);border-radius:14px;padding:0 14px;font-size:18px;font-family:inherit;background:var(--surface2);
  -webkit-user-select:text;user-select:text;outline:none;color:var(--text);touch-action:manipulation}
#dlgInput:focus{border-color:var(--primary)}
#dlgChips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{padding:11px 16px;border-radius:22px;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:15px}
.row{display:flex;gap:10px;margin-top:6px}
.row button{flex:1;height:54px;border-radius:14px;font-weight:800;font-size:17px;background:var(--chip);color:var(--text)}
.row button.ok{background:var(--primary);color:#fff}
#sheet{align-items:flex-end}
.sbox{background:var(--surface);width:100%;max-height:90dvh;overflow-y:auto;touch-action:pan-y;border-radius:26px 26px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom));animation:slide .22s ease-out}
.sbox::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{display:flex;align-items:center;gap:12px;min-height:62px;padding:6px 14px;border-radius:16px;background:var(--surface2);font-weight:700;font-size:15px;text-align:left;line-height:1.15;color:var(--text)}
.sbtn small{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:2px}
.sbtn .cdot{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--muted)}
.bom{background:var(--surface2);border-radius:14px;padding:6px 12px;margin:0 0 10px;max-height:38vh;overflow-y:auto;touch-action:pan-y}
.bom h4{margin:10px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--primary)}
.bom .brow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.bom .brow b{white-space:nowrap}
.bom small{display:block;color:var(--muted);font-size:11px;font-weight:600}
.bomempty{color:var(--muted);font-weight:600;padding:10px 0}
.sbtn.danger{color:var(--danger)}
.sbtn.primary{background:var(--ok);color:#03331a}
.sbtn.on{background:var(--primary-soft);box-shadow:inset 0 0 0 2px var(--primary)}
.sbtn:active{background:var(--primary-soft)}
.sbox p{font-size:13px;color:var(--muted);margin:14px 4px 0;line-height:1.4}
#cardOv .sbox{max-height:92dvh}
.cf{display:block;margin:0 0 10px}.cf span{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 2px 4px}
.cf input,.cf textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;font-family:inherit;background:var(--surface2);color:var(--text);-webkit-user-select:text;user-select:text;outline:none;touch-action:manipulation;resize:none}
.cf input{height:48px}.cf input:focus,.cf textarea:focus{border-color:var(--primary)}
.cfrow{display:flex;flex-wrap:wrap;gap:0 10px}.cfrow .cf{flex:1 1 100%}.cfrow .cf.half{flex:1 1 calc(50% - 5px);min-width:140px}
.cfh{font-size:13px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.06em;margin:14px 2px 6px}
.cklist .ck{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.cklist .cbx{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--muted);background:var(--surface);display:flex;align-items:center;justify-content:center;color:#fff}
.cklist .ck.done .cbx{background:var(--ok);border-color:var(--ok)}
.cklist .cbx svg.ic{width:26px;height:26px;stroke-width:3.2}
.cklist input{flex:1;min-width:0;height:44px;border:2px solid transparent;border-radius:10px;padding:0 8px;font-size:16px;font-family:inherit;background:transparent;color:var(--text);-webkit-user-select:text;user-select:text;outline:none;touch-action:manipulation}
.cklist input:focus{border-color:var(--primary);background:var(--surface2)}
.cklist .ck.done input{text-decoration:line-through;color:var(--muted)}
.cklist .cdel{flex:none;width:40px;height:44px;color:var(--muted);font-size:16px}
.cfbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.cfbtns.one{grid-template-columns:1fr}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.phb i{position:absolute;inset:0;background-size:cover;background-position:center}
.phb em{position:absolute;left:0;right:0;bottom:0;background:rgba(10,30,60,.75);color:#fff;font-size:11px;font-style:normal;font-weight:700;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phfull{display:block;width:100%;max-height:46vh;object-fit:contain;background:#000;border-radius:14px;margin:0 0 10px}
#quoteOv .sbox,#pbOv .sbox{max-height:94dvh}
.qhint{font-size:13px;color:var(--muted);margin:4px 2px 10px;line-height:1.4}.qhint code{background:var(--surface2);padding:1px 5px;border-radius:5px;font-size:12px}
.qrow{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:0 0 7px}.qrow.miss{border-color:#e7a100}
.qnm{font-size:14px;font-weight:700;line-height:1.25;margin:0 0 6px;word-break:break-word}.qnm small{display:block;font-size:11px;color:#b86e00;font-weight:800;margin-top:1px}
.qctl{display:flex;align-items:center;gap:5px;flex-wrap:nowrap}.qu{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.qin{height:42px;border:2px solid var(--line);border-radius:10px;padding:0 8px;font-size:16px;font-family:inherit;background:var(--surface);color:var(--text);-webkit-user-select:text;user-select:text;outline:none;touch-action:manipulation;min-width:0}
.qin:focus{border-color:var(--primary)}.qname{width:100%;margin:0 0 6px;display:block;box-sizing:border-box}.qsearch{width:100%;box-sizing:border-box;margin:0 0 8px}
.qt{margin-left:auto;font-size:14px;white-space:nowrap}.qx{flex:none;width:36px;height:42px;color:var(--muted);font-size:15px}
.qsm{min-height:44px;margin:0 0 8px;width:100%}
.qmv{display:flex;gap:10px}.qf{flex:1;display:block}.qf span{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 2px 4px}.qf .qin{width:100%;box-sizing:border-box}
.qtot{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0}
.qtot div{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}.qtot .sub{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:700}
.qtot .grand{border-top:2px solid var(--brand2);margin-top:6px;padding-top:8px;font-size:20px;font-weight:900;color:var(--brand2)}.qtot .warn{color:#b86e00;font-weight:800;font-size:12px}
.qpaste{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:14px;font-family:ui-monospace,monospace;background:var(--surface2);color:var(--text);-webkit-user-select:text;user-select:text;touch-action:manipulation;margin:0 0 8px}
.pblist{max-height:38dvh;overflow-y:auto;touch-action:pan-y;margin:0 0 8px}
#tipPill{position:absolute;right:10px;top:10px;height:34px;padding:0 12px 0 9px;border-radius:17px;background:#fff3cf;color:#6b4a00;border:1px solid #e7b94a;font-size:13px;font-weight:800;display:none;align-items:center;gap:5px;box-shadow:var(--shadow);z-index:5}
#tipPill svg.ic{width:18px;height:18px}
html[data-theme=dark] #tipPill{background:#4a3a10;color:#ffe199;border-color:#8a6a1d}
#tipOv .sbox{max-height:92dvh}
.hrow{background:var(--surface2);border:1px solid var(--line);border-left:5px solid #e7b94a;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.htitle{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:800;margin:0 0 4px}.htitle svg.ic{width:20px;height:20px;color:#b37a00;flex:none}
.hbody{font-size:14px;line-height:1.4;margin:0 0 6px}.hstd{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.35}
.hbtn{display:grid;grid-template-columns:1fr 1fr;gap:6px}.hbtn .sbtn{min-height:48px;padding:6px 8px}.hbtn .sbtn:first-child:nth-last-child(3){grid-column:1/-1}
#toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:rgba(18,38,58,.96);color:#fff;padding:12px 18px;border-radius:16px;
  font-size:15px;font-weight:600;z-index:80;max-width:88%;text-align:center;display:none;pointer-events:none;box-shadow:var(--shadow)}
#toast.show{display:block;animation:pop .18s ease-out}
#endmenu,#nudge,#alignpad{position:absolute;z-index:20;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);padding:8px;display:none;overflow-y:auto;touch-action:pan-y}
#endmenu.show,#nudge.show,#alignpad.show{display:block;animation:pop .16s ease-out}
#endmenu .eh{display:flex;gap:6px;margin-bottom:6px}
#endmenu .eh button{flex:1;height:46px;border-radius:12px;background:var(--primary-soft);color:var(--primary);font-weight:800;font-size:13px}
#endmenu .eh button.x{flex:0 0 46px;background:var(--chip);color:var(--muted)}
#endmenu .eg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
#endmenu .eg button{height:78px;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text);padding:0}
#endmenu canvas{width:46px;height:46px;pointer-events:none;background:#fff;border-radius:8px}
#nudge{right:72px;bottom:84px;width:206px;display:none;padding:10px}
#nudge.show{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#nudge button{height:52px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--text)}
#nudge button:active{background:var(--primary-soft)}
#nudge button.step{background:var(--primary-soft);color:var(--primary)}
#alignpad{left:8px;right:72px;bottom:84px;padding:10px}
#alignpad.show{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#alignpad button{height:56px;border-radius:14px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:11px;gap:2px;color:var(--text)}
#alignpad button:active{background:var(--primary-soft)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (orientation:landscape) and (max-height:520px){
  #app{grid-template-columns:minmax(0,1fr) 88px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top tools" "stage tools" "opts tools"}
  .top{padding:4px 8px}
  #title,.topbtn{height:40px}
  #tools{flex-direction:column;border-top:0;border-left:1px solid var(--line);padding:4px 6px;padding-right:calc(6px + env(safe-area-inset-right));overflow-y:auto}
  .tbtn{height:auto;min-height:44px;flex:1 0 auto;font-size:11px}
  #opts{height:72px}
  #opts.tall{height:146px}
  .tile canvas{width:42px;height:42px}
  .tiles button{height:78px}
  #fab{flex-direction:row;right:auto;left:8px;bottom:auto;top:8px}
  .fb{width:46px;height:46px}
  #hud,#modeBadge{left:auto;right:8px}
  #selbar{right:8px;bottom:8px;left:8px}
  #selbar button{height:50px}
  #toast{top:56px}

function cleanItems(arr){
  var out=[],dropped=0,n=function(v){return typeof v==='number'&&isFinite(v)};

    var ok=i&&typeof i==='object';
    if(ok){
      if(i.t==='stamp'){ok=!!stampDef(i.k)&&n(i.x)&&n(i.y);if(ok&&i.mat&&!MATS[i.mat])i.mat='pvc';if(ok&&i.v&&!(VW[i.k]&&VW[i.k][i.v]))delete i.v;if(ok&&(!i.v||i.v!=='iso'||!(i.io>=0&&i.io<24&&Math.floor(i.io)===i.io)))delete i.io}

      else if(i.t==='pen'||i.t==='erase'){ok=Array.isArray(i.pts)&&i.pts.length>=2&&n(i.w)&&i.pts.every(n)}
      else ok=false}
    if(ok)out.push(i);else dropped++});
  return {items:out,dropped:dropped};
}

function placeTemplate(t){
  var wasEmpty=!S.items.some(function(i){return i.t!=='erase'});
  if(t[4]==='iso'&&S.mode!=='iso'){S.mode='iso';syncMode()}else if(t[4]!=='iso'&&S.mode!=='plan'&&!t[4]){S.mode='plan';syncMode()}
  var items=t[3]();if(!items.length)return;
  var tw=items.filter(isWall);items.forEach(function(s2){if(!isHost(s2))return;tw.forEach(function(w){var pr=projSeg(s2,w.a,w.b),g=wallGeo(w);if(pr.d<g.h+3){s2.wt=(w.mm||110)/(s2.s||1)}})});
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;items.forEach(function(i){var b=bounds(i);if(!b)return;x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h)});
  var c=wasEmpty?{x:0,y:0}:viewCenter(),dx=c.x-(x0+x1)/2,dy=c.y-(y0+y1)/2;
  items.forEach(function(i){shiftItem(i,dx,dy);S.items.push(i)});
  setTool('move');setMulti(items);commit();
  if(wasEmpty)fitView();
  toast(t[1]+' template added – drag it, or tap Select to edit',3200);
}

  var raw=new TextEncoder().encode(JSON.stringify(o,shortNums)),tag='0.',body=raw;
  if(typeof CompressionStream==='function'){try{body=await deflateRaw(raw);tag='1.'}catch(e){body=raw;tag='0.'}}
  var enc=b64uEnc(body),base=location.origin+location.pathname,url=base+LINK_PFX+tag+enc;
  return {url:url,len:url.length,raw:raw.length,items:o.doc.items.length,ok:url.length<=LINK_MAX,hard:url.length>LINK_HARD,compressed:tag==='1.'}}
async function parseJobLink(hash){
  var m=/^#job=([01])\.([A-Za-z0-9_\-]+)$/.exec(hash||'');if(!m)throw new Error('bad link');
  if(m[2].length>LINK_HARD*2)throw new Error('too big');
  var u8=b64uDec(m[2]);
  if(m[1]==='1'){if(typeof DecompressionStream!=='function')throw new Error('nodecomp');u8=await inflateRaw(u8,6*1024*1024)}
  else if(u8.length>6*1024*1024)throw new Error('too big');
  var o=JSON.parse(new TextDecoder().decode(u8));
  if(!o||o.app!=='plumbing-sketch'||!o.doc||!Array.isArray(o.doc.items))throw new Error('bad link');
  if(o.doc.card&&typeof o.doc.card==='object')o.doc.card.photos=[];
  return o}
function clearHash(){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
async function openLinkHash(hash,auto){

  var n=o.doc.items.length,t=String(o.doc.title||'').slice(0,80).trim()||'Untitled job',who=o.doc.card&&o.doc.card.cust?String(o.doc.card.cust).slice(0,60):'';
  return new Promise(function(res){
    sheet('Open shared job?',[
      {ic:'import',label:'Open “'+t+'”',sub:n+' item'+(n===1?'':'s')+(who?' · '+who:'')+' – saved as a NEW job, your current job stays in My jobs',primary:true,fn:function(){clearHash();importJobObj(o);res(true)}},
      {ic:'aleft',label:'Cancel',fn:function(){clearHash();res(false)}}],
      {cols:1,note:'Someone sent you a link that contains a whole job. Only open links from people you trust.'})})}
function linkBoot(){

var linkWho=false,linkQuote=false;
async function linkSheet(){
  toast('Preparing link…',900);
  var L=await makeJobLink({who:linkWho,quote:linkQuote});
  if(!L){toast('Nothing to share yet');return}
  var kb=Math.max(1,Math.round(L.len/1000));
  var items=[];
  if(L.ok){
    items.push({ic:'share',label:'Share link',sub:'WhatsApp, email, message…',primary:true,fn:function(){shareLink(L)}});
    items.push({ic:'dup',label:'Copy link',sub:L.len+' characters',fn:function(){copyLink(L)}})}
  else{
    items.push({ic:'export',label:'Send job file instead',sub:'This job is too big for a link ('+kb+' KB)',primary:true,fn:function(){exportJob()}});
    if(!L.hard)items.push({ic:'dup',label:'Copy the long link anyway',sub:kb+' KB – some apps will cut it off',fn:function(){copyLink(L)}})}
  items.push({ic:'info',label:'Include customer details: '+(linkWho?'YES':'no'),sub:linkWho?'Name, phone, address, notes are inside the link':'Sketch & checklist only',on:linkWho,keep:true,fn:function(){linkWho=!linkWho;linkSheet()}});
  items.push({ic:'pdf',label:'Include quote lines: '+(linkQuote?'YES':'no'),sub:linkQuote?'Quantities, extras, labour & markup':'Prices stay on your phone',on:linkQuote,keep:true,fn:function(){linkQuote=!linkQuote;linkSheet()}});
  sheet('Share job as a link',items,{cols:1,note:'The link contains the job itself (compressed) – there is no server. Anyone who gets the link can read it, so send it only to people you trust. Photos are never included; use the job file for those. The other person opens it in this app and gets a copy.'})}
async function shareLink(L){
  var t=(S.title||'').trim()||'Plumbing job';
  if(navigator.share){try{await navigator.share({title:'Plumbing job: '+t,text:'Plumbing job: '+t+' – open in Plumbing Sketch',url:L.url});return}catch(e){if(e&&e.name==='AbortError')return}}
  copyLink(L)}
async function copyLink(L){
  try{await navigator.clipboard.writeText(L.url);toast('Link copied – paste it into WhatsApp or a message',3600);return}catch(e){}
  try{var ta=document.createElement('textarea');ta.value=L.url;ta.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();var ok=document.execCommand('copy');ta.remove();if(ok){toast('Link copied – paste it into WhatsApp or a message',3600);return}}catch(e){}
  askText({title:'Copy this link',value:L.url,placeholder:'',cancel:'Close'})}

/* ---------- photo ---------- */
function onPhoto(file){
  if(!file)return;
  var url=URL.createObjectURL(file),im=new Image();
  im.onload=function(){
    var W=im.naturalWidth,H=im.naturalHeight,sc=Math.min(1,1800/Math.max(W,H)),w=Math.round(W*sc),h=Math.round(H*sc);
    var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
    var data;try{data=c.toDataURL('image/jpeg',0.82)}catch(e){toast('Could not process that photo');URL.revokeObjectURL(url);return}
    URL.revokeObjectURL(url);
    var f=Math.min(cw*0.94/w,ch*0.94/h)/V.z,rw=w*f,rh=h*f,ctr=viewCenter();
    setBg(data,{x:ctr.x-rw/2,y:ctr.y-rh/2,w:rw,h:rh});commit();toast('Photo added – draw on top of it');
  };
  im.onerror=function(){URL.revokeObjectURL(url);toast('Could not open that photo')};
  im.src=url;
}
