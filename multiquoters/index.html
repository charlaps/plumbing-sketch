<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B5F59">
  <meta name="description" content="Multiquoters — post a home job once. Up to three South African contractors win the lead by bidding tokens, then you compare their quotes.">
  <title>Multiquoters</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <img src="icon.svg" width="36" height="36" alt="">
      <span>Multiquoters</span>
    </a>
    <div class="role-wrap">
      <span class="role-label">You're viewing as</span>
      <div class="switch" id="role-switch" role="group" aria-label="Switch role"></div>
    </div>
  </header>
  <div id="viewing-as" class="viewing-as">You're viewing as: Client</div>
  <div class="demo-banner">
    <p><strong>Demo mode.</strong> Pretend tokens and fictional jobs. Nothing is charged.</p>
    <div class="demo-actions">
      <a href="#/admin">Overview</a>
      <button type="button" id="reset-demo">Reset demo</button>
    </div>
  </div>
  <nav id="subnav" class="subnav" aria-label="Section"></nav>
  <main id="view" class="wrap"></main>
  <nav id="bottom-nav" class="bottom-nav" aria-label="Primary"></nav>
  <div id="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
